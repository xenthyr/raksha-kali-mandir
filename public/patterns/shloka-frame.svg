<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 800 500"
  width="800"
  height="500"
  fill="none"
  xml:space="preserve"
>
  <title>পবিত্র শ্লোক তোরণ ফ্রেম নকশা (Sacred Shloka Border Frame)</title>
  <desc>Architectural devotional shloka display frame for Sri Sri Maa Raksha Kali Mandir. Features ceremonial double-fillet borders, traditional Bengali terracotta paisley kalka corners, apex Trishula-Kalasa finial, basal Purnadal Rakta Padma plinth, and luminous ivory sanctum card area. Canonical 5-Color System (#8F241C, #FAF0CE, #FFFDF7, #D9B15B, #694611). Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Multi-Stop Temple Gold Gradient -->
    <linearGradient id="shlGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="22%" stop-color="#FAF0CE"/>
      <stop offset="50%" stop-color="#D9B15B"/>
      <stop offset="78%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>

    <!-- Deep Crimson / Raktachandan Gradient -->
    <linearGradient id="shlCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA3327"/>
      <stop offset="42%" stop-color="#8F241C"/>
      <stop offset="82%" stop-color="#65120D"/>
      <stop offset="100%" stop-color="#4A0A07"/>
    </linearGradient>

    <!-- Inner Sanctum Card Parchment Luminous Glow -->
    <radialGradient id="shlSanctumBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FAF0CE"/>
      <stop offset="100%" stop-color="#F2E3C6"/>
    </radialGradient>

    <!-- Corner Ambient Drop Shadow -->
    <radialGradient id="shlShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24201D" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#24201D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#24201D" stop-opacity="0"/>
    </radialGradient>

    <!-- REUSABLE CORNER KALKA (Traditional Bengali Terracotta Paisley Motif) -->
    <g id="kalkaCornerUnit">
      <!-- Ambient Under-Shadow -->
      <ellipse cx="48" cy="48" rx="36" ry="36" fill="url(#shlShadow)"/>

      <!-- Primary Outer Paisley Curl -->
      <path
        d="
          M 16,16
          C 36,10 68,14 82,32
          C 92,44 94,62 84,74
          C 74,86 54,88 44,78
          C 36,70 36,56 46,48
          C 54,42 64,48 62,56
          C 60,62 52,62 50,58
          C 46,50 60,34 72,40
          C 78,44 76,58 68,66
          C 58,76 34,68 28,48
          C 24,34 18,22 16,16
          Z
        "
        fill="url(#shlCrimsonGrad)"
        stroke="url(#shlGoldGrad)"
        stroke-width="1.2"
        stroke-linejoin="round"
      />

      <!-- Radiating Rice-Paste Inlay Striae -->
      <g stroke="#FAF0CE" stroke-width="0.75" stroke-linecap="round" opacity="0.85" fill="none">
        <path d="M 32,24 C 44,22 62,26 70,36"/>
        <path d="M 38,34 C 48,32 60,36 66,44"/>
        <path d="M 44,44 C 52,42 58,46 60,50"/>
      </g>

      <!-- Corner Golden Rosette Core -->
      <circle cx="28" cy="28" r="6.5" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.8"/>
      <circle cx="28" cy="28" r="4.2" fill="#8F241C"/>
      <circle cx="28" cy="28" r="1.6" fill="#FFFDF7"/>

      <!-- Delicate Flourish Tendril Sprays -->
      <path d="M 28,16 C 34,8 52,8 60,14" stroke="url(#shlGoldGrad)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="14" r="1.4" fill="url(#shlGoldGrad)"/>
      <path d="M 16,28 C 8,34 8,52 14,60" stroke="url(#shlGoldGrad)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <circle cx="14" cy="60" r="1.4" fill="url(#shlGoldGrad)"/>
    </g>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. BASE BACKGROUND & SANCTUM SHLOKA CANVAS                    -->
  <!-- ============================================================ -->
  <!-- Deep Terracotta Frame Rim Outer Bed -->
  <rect x="0" y="0" width="800" height="500" rx="12" fill="#4E0C08"/>

  <!-- Inner Shloka Writing Parchment Canvas -->
  <rect x="24" y="24" width="752" height="452" rx="8" fill="url(#shlSanctumBg)" stroke="url(#shlGoldGrad)" stroke-width="1.5"/>

  <!-- Subtle Inner Inset Shadow Border -->
  <rect x="36" y="36" width="728" height="428" rx="6" fill="none" stroke="#D9B15B" stroke-width="0.75" opacity="0.6"/>

  <!-- ============================================================ -->
  <!-- 2. ARCHITECTURAL GUARD RAILS & CONTINUOUS DANTIKA FRINGE     -->
  <!-- ============================================================ -->
  <!-- Outer Double Gold Fillet -->
  <rect x="12" y="12" width="776" height="476" rx="10" fill="none" stroke="url(#shlGoldGrad)" stroke-width="2"/>
  <rect x="18" y="18" width="764" height="464" rx="8" fill="none" stroke="#8F241C" stroke-width="1.2"/>

  <!-- Running Beaded Muktamala Chain (শীর্ষ ও নিম্ন মুক্তামালা) -->
  <line x1="120" y1="20" x2="680" y2="20" stroke="url(#shlGoldGrad)" stroke-width="1.4" stroke-dasharray="2 3"/>
  <line x1="120" y1="480" x2="680" y2="480" stroke="url(#shlGoldGrad)" stroke-width="1.4" stroke-dasharray="2 3"/>
  <line x1="20" y1="120" x2="20" y2="380" stroke="url(#shlGoldGrad)" stroke-width="1.4" stroke-dasharray="2 3"/>
  <line x1="780" y1="120" x2="780" y2="380" stroke="url(#shlGoldGrad)" stroke-width="1.4" stroke-dasharray="2 3"/>

  <!-- ============================================================ -->
  <!-- 3. FOUR ORNATE CORNER BENGALI KALKA PANELS                   -->
  <!-- ============================================================ -->
  <!-- Top-Left Corner -->
  <use xlink:href="#kalkaCornerUnit" href="#kalkaCornerUnit" x="0" y="0"/>

  <!-- Top-Right Corner (Flipped horizontally) -->
  <g transform="translate(800, 0) scale(-1, 1)">
    <use xlink:href="#kalkaCornerUnit" href="#kalkaCornerUnit"/>
  </g>

  <!-- Bottom-Left Corner (Flipped vertically) -->
  <g transform="translate(0, 500) scale(1, -1)">
    <use xlink:href="#kalkaCornerUnit" href="#kalkaCornerUnit"/>
  </g>

  <!-- Bottom-Right Corner (Flipped both horizontally & vertically) -->
  <g transform="translate(800, 500) scale(-1, -1)">
    <use xlink:href="#kalkaCornerUnit" href="#kalkaCornerUnit"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. APEX CREST: SACRED TRISHULA & KALASA FINIAL (শীর্ষ চূড়া)   -->
  <!-- Centered at X=400, Y=0 to Y=48                              -->
  <!-- ============================================================ -->
  <g id="apexFinialCrest" transform="translate(400, 24)">
    <!-- Aura Radiance Glow -->
    <circle cx="0" cy="8" r="22" fill="url(#shlShadow)"/>

    <!-- Sacred Kalasa Base Urn -->
    <ellipse cx="0" cy="18" rx="14" ry="4.5" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.8"/>
    <path d="M -10,18 C -12,12 12,12 10,18 Z" fill="#8F241C" stroke="url(#shlGoldGrad)" stroke-width="0.6"/>

    <!-- Flanking Auspicious Mango Leaves -->
    <path d="M -8,14 C -18,10 -24,4 -22,0 C -18,2 -12,8 -6,12 Z" fill="#2F5E38" stroke="#142B18" stroke-width="0.4"/>
    <path d="M 8,14 C 18,10 24,4 22,0 C 18,2 12,8 6,12 Z" fill="#2F5E38" stroke="#142B18" stroke-width="0.4"/>

    <!-- Center Trishula Prongs -->
    <!-- Left Crescent Barb -->
    <path d="M -3,10 C -9,9 -15,5 -15,0 C -12,2 -7,5 -2,7 Z" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.6"/>
    <!-- Right Crescent Barb -->
    <path d="M 3,10 C 9,9 15,5 15,0 C 12,2 7,5 2,7 Z" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.6"/>
    <!-- Central Spear Blade -->
    <path d="M 0,-6 C -3,2 -3,8 0,11 C 3,8 3,2 0,-6 Z" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.7"/>
    <line x1="0" y1="-4" x2="0" y2="10" stroke="#8F241C" stroke-width="0.6"/>

    <!-- Consecrated Vermilion Bindu -->
    <circle cx="0" cy="4" r="1.6" fill="#8F241C" stroke="#FAF0CE" stroke-width="0.4"/>
    <circle cx="0" cy="4" r="0.5" fill="#FFFDF7"/>
  </g>

  <!-- ============================================================ -->
  <!-- 5. BASAL PEDESTAL: BLOOMING RAKTA PADMA PLINTH (অধো পদ্মপীঠ) -->
  <!-- Centered at X=400, Y=476                                     -->
  <!-- ============================================================ -->
  <g id="basalLotusPlinth" transform="translate(400, 476)">
    <!-- Base Mounting Plinth -->
    <ellipse cx="0" cy="-2" rx="28" ry="4" fill="url(#shlShadow)"/>
    <path d="M -24,-2 C -18,-8 18,-8 24,-2 L 20,2 L -20,2 Z" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.7"/>

    <!-- 7 Blooming Lotus Petals -->
    <!-- Outer Left -->
    <path d="M 0,-4 C -8,-4 -18,-8 -22,-16 C -18,-18 -10,-12 -2,-6 Z" fill="url(#shlCrimsonGrad)" stroke="url(#shlGoldGrad)" stroke-width="0.5"/>
    <!-- Outer Right -->
    <path d="M 0,-4 C 8,-4 18,-8 22,-16 C 18,-18 10,-12 2,-6 Z" fill="url(#shlCrimsonGrad)" stroke="url(#shlGoldGrad)" stroke-width="0.5"/>
    <!-- Mid Left -->
    <path d="M 0,-5 C -6,-10 -12,-18 -10,-24 C -6,-22 -2,-14 0,-7 Z" fill="url(#shlCrimsonGrad)" stroke="url(#shlGoldGrad)" stroke-width="0.5"/>
    <!-- Mid Right -->
    <path d="M 0,-5 C 6,-10 12,-18 10,-24 C 6,-22 2,-14 0,-7 Z" fill="url(#shlCrimsonGrad)" stroke="url(#shlGoldGrad)" stroke-width="0.5"/>
    <!-- Center Sovereign Apex Petal -->
    <path d="M 0,-6 C -4,-14 -4,-22 0,-28 C 4,-22 4,-14 0,-6 Z" fill="url(#shlCrimsonGrad)" stroke="url(#shlGoldGrad)" stroke-width="0.6"/>
    <line x1="0" y1="-8" x2="0" y2="-26" stroke="#FAF0CE" stroke-width="0.5" opacity="0.8"/>

    <!-- Golden Stamen Torus Core -->
    <circle cx="0" cy="-7" r="3.2" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.4"/>
    <circle cx="0" cy="-7" r="1.4" fill="#8F241C"/>
    <circle cx="0" cy="-7" r="0.5" fill="#FFFDF7"/>
  </g>

  <!-- ============================================================ -->
  <!-- 6. LATERAL FLANKING MEDALLIONS (পার্শ্বীয় স্বর্ণ চক্র)         -->
  <!-- ============================================================ -->
  <!-- Left Flank Medallion (X=20, Y=250) -->
  <g transform="translate(20, 250)">
    <circle cx="0" cy="0" r="6" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3.8" fill="#8F241C"/>
    <circle cx="0" cy="0" r="1.2" fill="#FAF0CE"/>
    <path d="M 0,-8 L 0,-16 M 0,8 L 0,16" stroke="url(#shlGoldGrad)" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Right Flank Medallion (X=780, Y=250) -->
  <g transform="translate(780, 250)">
    <circle cx="0" cy="0" r="6" fill="url(#shlGoldGrad)" stroke="#694611" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3.8" fill="#8F241C"/>
    <circle cx="0" cy="0" r="1.2" fill="#FAF0CE"/>
    <path d="M 0,-8 L 0,-16 M 0,8 L 0,16" stroke="url(#shlGoldGrad)" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
