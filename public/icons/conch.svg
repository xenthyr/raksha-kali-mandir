<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="48"
  height="48"
  fill="none"
  xml:space="preserve"
>
  <title>মঙ্গল শঙ্খ প্রতীক (Sacred Conch Shell Icon)</title>
  <desc>Sacred ritual Dakshinavarti Shankha resting upon an ornate brass kurma tripod stand, embellished with natural spiral sutures, pearlescent nacre, consecrated raktachandan tilak, and auspicious sindoor swastika for Sri Sri Maa Raksha Kali Mandir. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Burnished Temple Brass / Gold Multi-Stop Lustre -->
    <linearGradient id="shkGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0CE"/>
      <stop offset="28%" stop-color="#D9B15B"/>
      <stop offset="68%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>

    <!-- Natural Conch Mother-of-Pearl (Nacre) Volumetric Shading -->
    <radialGradient id="shkNacreBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FFFDF7"/>
      <stop offset="72%" stop-color="#FBF4E6"/>
      <stop offset="90%" stop-color="#F2E3C9"/>
      <stop offset="100%" stop-color="#DEC6A2"/>
    </radialGradient>

    <!-- Shell Interior Lip / Siphonal Canal Depth -->
    <radialGradient id="shkApertureDepth" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B08A3E"/>
      <stop offset="45%" stop-color="#8F241C"/>
      <stop offset="85%" stop-color="#55100B"/>
      <stop offset="100%" stop-color="#24201D"/>
    </radialGradient>

    <!-- Consecrated Vermilion / Raktachandan Lustre -->
    <linearGradient id="shkCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8261C"/>
      <stop offset="55%" stop-color="#8F241C"/>
      <stop offset="100%" stop-color="#5E0F0A"/>
    </linearGradient>

    <!-- Soft Cast Shadow Under Stand -->
    <radialGradient id="shkFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24201D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#24201D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#24201D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. PEDESTAL FOUNDATION: BRASS KURMA TRIPOD (পিতলের ত্রিপদী বেদি) -->
  <!-- ============================================================ -->
  <!-- Floor Contact Shadow -->
  <ellipse cx="24" cy="42" rx="17" ry="3.2" fill="url(#shkFloorShadow)"/>

  <!-- Ornate Curved Tripod Legs with Paw Feet -->
  <!-- Left Leg -->
  <path
    d="M 12.5,41.5 C 13.5,39 16.5,35 19,34"
    stroke="url(#shkGoldLinear)"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="12" cy="41.5" rx="1.6" ry="0.9" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.4"/>

  <!-- Right Leg -->
  <path
    d="M 35.5,41.5 C 34.5,39 31.5,35 29,34"
    stroke="url(#shkGoldLinear)"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="36" cy="41.5" rx="1.6" ry="0.9" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.4"/>

  <!-- Center Back Leg -->
  <line x1="24" y1="34" x2="24" y2="42.2" stroke="url(#shkGoldLinear)" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="24" cy="42.2" rx="1.4" ry="0.8" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.4"/>

  <!-- Circular Ring Platform with Beaded Rim (ত্রিপদীর বলয়) -->
  <ellipse cx="24" cy="34" rx="9.5" ry="2.8" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.8"/>
  <ellipse cx="24" cy="34" rx="7.8" ry="1.9" fill="#24201D" opacity="0.45"/>

  <!-- Beaded Edge Granules on Tripod Ring -->
  <circle cx="16" cy="34.2" r="0.6" fill="#FAF0CE"/>
  <circle cx="19.8" cy="35.3" r="0.6" fill="#FAF0CE"/>
  <circle cx="24" cy="35.6" r="0.6" fill="#FAF0CE"/>
  <circle cx="28.2" cy="35.3" r="0.6" fill="#FAF0CE"/>
  <circle cx="32" cy="34.2" r="0.6" fill="#FAF0CE"/>

  <!-- ============================================================ -->
  <!-- 2. ANATOMICAL CONCH SHELL: MAIN BODY & APERTURE             -->
  <!-- Orientation: Sacred ritual repose tilted at ~22°            -->
  <!-- ============================================================ -->
  <!-- Underbelly Cast Shadow on Stand -->
  <path
    d="M 14,29 C 18,33 30,33 34,29 C 30,35 18,35 14,29 Z"
    fill="#24201D"
    opacity="0.35"
  />

  <!-- Siphonal Canal Beak & Outer Lip Cavity (শঙ্খের উন্মুক্ত মুখ ও গর্ভ) -->
  <path
    d="
      M 31,13
      C 37.5,14.5 42,20 40.5,27
      C 39.5,31.5 35,34 30.5,31.5
      C 27,29.5 28,23 29.5,18
      C 30,16 30.5,14 31,13
      Z
    "
    fill="url(#shkApertureDepth)"
    stroke="url(#shkGoldLinear)"
    stroke-width="1.1"
    stroke-linejoin="round"
  />

  <!-- Main Body Whorl & Pearlescent Dorsum (শঙ্খের স্থূল কুন্তল কায়া) -->
  <path
    d="
      M 9,25
      C 5.5,18 11.5,9.5 22,11
      C 28,12 32.5,14 34,17.5
      C 35.8,22 34,27.5 30.5,30.5
      C 26,34 16,33 11,28.5
      C 9.8,27.5 9.2,26.2 9,25
      Z
    "
    fill="url(#shkNacreBody)"
    stroke="#B08A3E"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Specular High-Gloss Highlights on Rounded Belly -->
  <path
    d="
      M 14,19
      C 12,14 17,12.5 23,13
      C 26,13.2 28,14.5 29,16.5
    "
    stroke="#FFFFFF"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"
  />
  <ellipse cx="16" cy="18" rx="1.8" ry="3.5" transform="rotate(-30 16 18)" fill="#FFFFFF" opacity="0.6"/>

  <!-- Spiral Columella / Apex Spire Whorls (শঙ্খের কুন্তল পাক ও চূড়া) -->
  <g fill="none" stroke-linecap="round">
    <!-- Primary Apical Suture -->
    <path
      d="M 9,25 C 7,23 7,18 11,16.5 C 15.5,15 18,18 18,21.5"
      stroke="#765217"
      stroke-width="1.3"
    />
    <path
      d="M 8.5,24.5 C 7,22.8 7,18.5 10.5,17 C 14.5,15.8 17,18.2 17,21"
      stroke="#8F241C"
      stroke-width="0.8"
    />

    <!-- Secondary Inner Whorl -->
    <path
      d="M 11.5,17 C 13.5,13.5 19,14 21,18.5"
      stroke="#B08A3E"
      stroke-width="1"
    />

    <!-- Tertiary Growth Striae Lines (প্রাকৃতিক খাঁজ ও বলয়রেখা) -->
    <path
      d="M 16,21 C 18,24 23,25.5 26,24.5"
      stroke="#D9B15B"
      stroke-width="0.75"
      opacity="0.8"
    />
    <path
      d="M 12.5,26 C 15,29 21,30.5 25,29.5"
      stroke="#D9B15B"
      stroke-width="0.6"
      opacity="0.7"
    />
  </g>

  <!-- Spire Tip / Apex Pearl Button (শঙ্খের অগ্রচূড়া) -->
  <circle cx="8" cy="22.5" r="1.4" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.5"/>
  <circle cx="7.7" cy="22.2" r="0.5" fill="#FFFFFF"/>

  <!-- Smooth Outer Flared Lip with Gilded Border (কনক মোড়ানো ওষ্ঠ কানা) -->
  <path
    d="
      M 31,13
      C 34.5,14 39,18 39.5,24.5
      C 40,29.5 35.5,33 31.5,31.8
      C 29.5,31 29,26 29.8,20
      C 30.2,16.5 30.6,14.5 31,13
      Z
    "
    fill="url(#shkNacreBody)"
    stroke="url(#shkGoldLinear)"
    stroke-width="1.2"
  />

  <!-- Reflected Crimson Lustre Along Inner Lip Aperture -->
  <path
    d="M 31.5,16 C 33.5,18 35,22 34,26 C 33,29 31,29.5 30,28"
    stroke="#8F241C"
    stroke-width="0.9"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Siphonal Beak Notch (অগ্র প্রনালী খাঁজ) -->
  <path d="M 39.5,25.5 C 41.5,26.5 42,28.5 40.5,30" stroke="url(#shkGoldLinear)" stroke-width="1" fill="none"/>

  <!-- ============================================================ -->
  <!-- 3. SACRED ADORNMENT: RAKTACHANDAN TILAK & SWASTIKA          -->
  <!-- ============================================================ -->
  <!-- Consecrated Vermilion Tilak Medallion (মা কালীর রক্তচন্দন তিলক) -->
  <g transform="translate(22.5, 21.5)">
    <!-- Gold Foil Aura Base -->
    <circle cx="0" cy="0" r="3.4" fill="url(#shkGoldLinear)" stroke="#694611" stroke-width="0.4"/>
    <!-- Deep Raktachandan Seal -->
    <circle cx="0" cy="0" r="2.6" fill="url(#shkCrimsonGrad)"/>

    <!-- Sacred Vedic Swastika / Auspicious Solar Emblem (স্বস্তিক প্রতীক) -->
    <path
      d="
        M 0,-1.6 V 1.6
        M -1.6,0 H 1.6
        M 0,-1.6 H 1.2
        M 1.6,0 V 1.2
        M 0,1.6 H -1.2
        M -1.6,0 V -1.2
      "
      stroke="#FFFDF7"
      stroke-width="0.55"
      stroke-linecap="square"
      fill="none"
    />

    <!-- Holy Sindoor Dot / Central Bindu -->
    <circle cx="0" cy="0" r="0.45" fill="#FAF0CE"/>
  </g>

  <!-- Holy Raktachandan Droplet Accents on Dorsum -->
  <circle cx="17.5" cy="24.8" r="0.8" fill="#8F241C"/>
  <circle cx="27.5" cy="18.2" r="0.7" fill="#8F241C"/>
</svg>
