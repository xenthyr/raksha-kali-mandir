<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 48 48"
width="280"
height="280"
fill="none"
xml:space="preserve"
style="max-width: 100%; height: auto; display: block; margin: 0 auto;"
> 
<title>পবিত্র পঞ্চমুখী রক্তজবা প্রতীক (Sacred Rakta Jaba Icon)</title>
<desc>Realistic sacred red hibiscus (Hibiscus rosa-sinensis / Rakta Jaba) icon beloved of Maa Raksha Kali, featuring ruffled layered petals, realistic venation, velvety crimson gradients, protruding staminal column with golden pollen anthers, and five-lobed velvet stigma. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>
<defs>
<!-- Background Petal Shadow -->
<radialGradient id="jabaPetalDark" cx="45%" cy="40%" r="65%">
<stop offset="0%" stop-color="#8F241C"/>
<stop offset="60%" stop-color="#65120D"/>
<stop offset="100%" stop-color="#380705"/>
</radialGradient>
<!-- Mid Petal Rich Crimson Gradient -->
<radialGradient id="jabaPetalMid" cx="40%" cy="30%" r="70%">
<stop offset="0%" stop-color="#C23023"/>
<stop offset="45%" stop-color="#A8261C"/>
<stop offset="80%" stop-color="#8F241C"/>
<stop offset="100%" stop-color="#550E09"/>
</radialGradient>
<!-- Fore Petal Velvet Highlight Gradient -->
<linearGradient id="jabaPetalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#D93829"/>
<stop offset="35%" stop-color="#B8281D"/>
<stop offset="75%" stop-color="#8F241C"/>
<stop offset="100%" stop-color="#4A0A07"/>
</linearGradient>
<!-- Deep Throat/Corolla Heart Shadow -->
<radialGradient id="jabaThroatGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#1A0302"/>
<stop offset="65%" stop-color="#4D0C08"/>
<stop offset="100%" stop-color="#8F241C" stop-opacity="0"/>
</radialGradient>
<!-- Staminal Column Gradient -->
<linearGradient id="jabaStaminalColumn" x1="0%" y1="100%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#4D0C08"/>
<stop offset="25%" stop-color="#8F241C"/>
<stop offset="65%" stop-color="#C86A12"/>
<stop offset="85%" stop-color="#F5A623"/>
<stop offset="100%" stop-color="#FAF0CE"/>
</linearGradient>
<!-- Golden Pollen Grains / Anthers -->
<radialGradient id="jabaPollenGold" cx="35%" cy="35%" r="65%">
<stop offset="0%" stop-color="#FFFDF7"/>
<stop offset="40%" stop-color="#F9EEC8"/>
<stop offset="75%" stop-color="#D9B15B"/>
<stop offset="100%" stop-color="#765217"/>
</radialGradient>
<!-- Velvet Stigma Pad -->
<radialGradient id="jabaStigmaRed" cx="35%" cy="35%" r="65%">
<stop offset="0%" stop-color="#C23023"/>
<stop offset="60%" stop-color="#8F241C"/>
<stop offset="100%" stop-color="#3D0604"/>
</radialGradient>
<!-- Under-Flower Ambient Soft Shadow -->
<radialGradient id="jabaDropShadow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#24201D" stop-opacity="0.4"/>
<stop offset="65%" stop-color="#24201D" stop-opacity="0.14"/>
<stop offset="100%" stop-color="#24201D" stop-opacity="0"/>
</radialGradient>
</defs>
<!-- Grounding Ambient Shadow -->
<ellipse cx="23.5" cy="27" rx="18.5" ry="15.5" fill="url(#jabaDropShadow)"/>
<!-- ============================================================ -->
<!-- 1. FIVE OVERLAPPING RUFFLED HIBISCUS PETALS                 -->
<!-- ============================================================ -->
<g id="hibiscusCorolla">
<!-- PETAL 1: LOWER-LEFT -->
<path
d="
M 22,26
C 17,28 12,34 9,37
C 6,40 6,43 10,43.5
C 14,44 19,40 22.5,35
C 23.5,33.5 23,29 22,26
Z
"
fill="url(#jabaPetalDark)"
stroke="#4A0A07"
stroke-width="0.5"
/>
<path d="M 20,29 C 16,33 13,38 10,41" stroke="#8F241C" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.75"/>
<path d="M 21,31 C 18,35 17,38 16,42" stroke="#8F241C" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.6"/>
<!-- PETAL 2: LOWER-RIGHT -->
<path
d="
M 22,26
C 25,29 29,36 34,39
C 38,41.5 42,40 41,36
C 40,32 34,26 29,24.5
C 26,23.8 23.5,24.5 22,26
Z
"
fill="url(#jabaPetalDark)"
stroke="#4A0A07"
stroke-width="0.5"
/>
<path d="M 24,27 C 29,30 34,33 38,36" stroke="#8F241C" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.75"/>
<path d="M 25,29 C 28,33 30,36 33,38" stroke="#8F241C" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.6"/>
<!-- PETAL 3: MID-LEFT FLANK -->
<path
d="
M 22,26
C 17,25 10,27 6,24
C 2.5,21 3,15 7,14
C 11.5,13 16,18 20,22
C 21.5,23.5 22,25 22,26
Z
"
fill="url(#jabaPetalMid)"
stroke="#550E09"
stroke-width="0.5"
/>
<path d="M 4.5,17.5 C 5.5,14.5 9,13.8 13,15" stroke="#D93829" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.65"/>
<path d="M 18,22 C 14,20 9,19 6,18" stroke="#65120D" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.8"/>
<path d="M 19,24 C 15,24 10,23 6,22" stroke="#65120D" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.7"/>
<!-- PETAL 4: TOP-LEFT CREST -->
<path
d="
M 22,26
C 19,21 14,14 16,8.5
C 17.5,4 23.5,4.5 26.5,8
C 29.5,11.5 27,18 23.5,24
C 22.8,25 22.3,25.5 22,26
Z
"
fill="url(#jabaPetalHighlight)"
stroke="#550E09"
stroke-width="0.5"
/>
<path d="M 18,7 C 21,5 25,5.5 26.5,8.5" stroke="#FFA399" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.45"/>
<path d="M 22,21 C 21,16 19,12 18,8" stroke="#65120D" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.8"/>
<path d="M 23,20 C 23.5,16 24.5,12 25,9" stroke="#65120D" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.7"/>
<!-- PETAL 5: MID-RIGHT OVERLAPPING -->
<path
d="
M 22,26
C 26,24 33,24 38,20
C 42,16.5 43,10 38,9
C 33,8 28,14 24,21
C 23,22.8 22.4,24.8 22,26
Z
"
fill="url(#jabaPetalHighlight)"
stroke="#550E09"
stroke-width="0.5"
/>
<path d="M 39,11 C 41,14 39,18 36,20" stroke="#FFA399" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.4"/>
<path d="M 25,22 C 30,19 35,16 38,13" stroke="#65120D" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.8"/>
<path d="M 26,24 C 31,23 35,21 38,18" stroke="#65120D" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.7"/>
<!-- COROLLA THROAT / EYE -->
<circle cx="22" cy="26" r="6" fill="url(#jabaThroatGlow)"/>
<circle cx="22" cy="26" r="2.8" fill="#1C0302"/>
</g>
<!-- ============================================================ -->
<!-- 2. STAMINAL COLUMN, POLLEN ANTHERS & FIVE-LOBED STIGMA       -->
<!-- ============================================================ -->
<g id="staminalColumnAndAnthers">
<!-- Staminal Column Shadow -->
<path
d="M 22,26 C 24,20 28.5,14 34,7"
stroke="#24201D"
stroke-width="2.2"
stroke-linecap="round"
opacity="0.3"
fill="none"
/>
<!-- Main Staminal Column Tube -->
<path
d="M 22,26 C 24,20 28.5,14 34,7"
stroke="url(#jabaStaminalColumn)"
stroke-width="1.8"
stroke-linecap="round"
fill="none"
/>
<!-- Specular Highlight Line -->
<path
d="M 22.8,24.5 C 24.5,19.5 28.5,14 33,8"
stroke="#FFFFFF"
stroke-width="0.55"
stroke-linecap="round"
opacity="0.75"
fill="none"
/>
<!-- Filament Stalks -->
<g stroke="url(#jabaPollenGold)" stroke-width="0.55" stroke-linecap="round" fill="none">
<line x1="26.5" y1="18.5" x2="24.2" y2="17.2"/>
<line x1="27.8" y1="16.5" x2="25.5" y2="14.8"/>
<line x1="29.2" y1="14.8" x2="27.2" y2="12.8"/>
<line x1="30.8" y1="12.8" x2="29.2" y2="10.5"/>
<line x1="32.2" y1="10.8" x2="31.2" y2="8.2"/>
<line x1="28.2" y1="17.8" x2="30.5" y2="18.8"/>
<line x1="29.5" y1="15.8" x2="32.2" y2="16.2"/>
<line x1="31.0" y1="13.8" x2="33.8" y2="13.8"/>
<line x1="32.5" y1="11.8" x2="35.2" y2="11.2"/>
<line x1="33.8" y1="9.8" x2="36.5" y2="8.8"/>
</g>
<!-- Golden Pollen Anthers -->
<g fill="url(#jabaPollenGold)" stroke="#694611" stroke-width="0.3">
<ellipse cx="23.8" cy="17" rx="1.1" ry="0.8" transform="rotate(-25 23.8 17)"/>
<ellipse cx="25.2" cy="14.5" rx="1.15" ry="0.8" transform="rotate(-35 25.2 14.5)"/>
<ellipse cx="26.8" cy="12.5" rx="1.15" ry="0.85" transform="rotate(-40 26.8 12.5)"/>
<ellipse cx="28.8" cy="10.2" rx="1.1" ry="0.8" transform="rotate(-45 28.8 10.2)"/>
<ellipse cx="30.8" cy="8" rx="1.05" ry="0.75" transform="rotate(-50 30.8 8)"/>
<ellipse cx="31" cy="19.2" rx="1.1" ry="0.8" transform="rotate(25 31 19.2)"/>
<ellipse cx="32.6" cy="16.5" rx="1.15" ry="0.85" transform="rotate(20 32.6 16.5)"/>
<ellipse cx="34.2" cy="14" rx="1.15" ry="0.85" transform="rotate(10 34.2 14)"/>
<ellipse cx="35.6" cy="11.2" rx="1.1" ry="0.8" transform="rotate(5 35.6 11.2)"/>
<ellipse cx="37" cy="8.6" rx="1.05" ry="0.75" transform="rotate(-5 37 8.6)"/>
<circle cx="28" cy="16" r="0.75"/>
<circle cx="30" cy="13.5" r="0.8"/>
<circle cx="32" cy="11" r="0.75"/>
</g>
<!-- Style Branches -->
<g stroke="#8F241C" stroke-width="0.7" stroke-linecap="round" fill="none">
<line x1="34" y1="7" x2="32.2" y2="4.5"/>
<line x1="34" y1="7" x2="33.8" y2="3.5"/>
<line x1="34" y1="7" x2="36" y2="4"/>
<line x1="34" y1="7" x2="37.2" y2="5.5"/>
<line x1="34" y1="7" x2="36.5" y2="7.5"/>
</g>
<!-- Five Velvet Crimson Stigma Pads -->
<g fill="url(#jabaStigmaRed)" stroke="#FAF0CE" stroke-width="0.3">
<circle cx="32" cy="4.2" r="1.35"/>
<circle cx="33.8" cy="3.2" r="1.4"/>
<circle cx="36.2" cy="3.8" r="1.4"/>
<circle cx="37.5" cy="5.5" r="1.35"/>
<circle cx="36.8" cy="7.6" r="1.3"/>
</g>
<!-- Gold Pollen Dust on Stigmas -->
<circle cx="32" cy="4.2" r="0.4" fill="#FAF0CE"/>
<circle cx="33.8" cy="3.2" r="0.45" fill="#FAF0CE"/>
<circle cx="36.2" cy="3.8" r="0.45" fill="#FAF0CE"/>
<circle cx="37.5" cy="5.5" r="0.4" fill="#FAF0CE"/>
<circle cx="36.8" cy="7.6" r="0.4" fill="#FAF0CE"/>
</g>
</svg>
