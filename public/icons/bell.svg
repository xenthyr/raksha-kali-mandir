<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="48"
  height="48"
  fill="none"
  xml:space="preserve"
>
  <title>মন্দির আরতি ঘণ্টা প্রতীক (Sacred Temple Aarti Bell Icon)</title>
  <desc>Ornate traditional brass temple bell (Mangal Ghanta) with interlocking suspension chain links, tiered canopy crown, incised lotus-rim relief, clapper, and vermilion silk tassel for Sri Sri Maa Raksha Kali Mandir. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Burnished Temple Brass / Gold Multi-Stop Radial Lustre -->
    <radialGradient id="bellDomeShine" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="22%" stop-color="#F9EEC8"/>
      <stop offset="55%" stop-color="#D9B15B"/>
      <stop offset="82%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#765217"/>
    </radialGradient>

    <!-- Linear Gold Accent Gradient -->
    <linearGradient id="bellGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0CE"/>
      <stop offset="30%" stop-color="#E5C16C"/>
      <stop offset="70%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>

    <!-- Deep Crimson Shading Gradient -->
    <linearGradient id="bellCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8261C"/>
      <stop offset="50%" stop-color="#8F241C"/>
      <stop offset="100%" stop-color="#5E0F0A"/>
    </linearGradient>

    <!-- Bell Interior Cavity Shadow -->
    <radialGradient id="bellCavityShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14110F"/>
      <stop offset="65%" stop-color="#24201D"/>
      <stop offset="100%" stop-color="#421A16"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. INTERLOCKING BRASS CHAIN & SUSPENSION EYELET               -->
  <!-- ============================================================ -->
  <!-- Topmost Wall/Ceiling Eyelet Ring -->
  <circle cx="24" cy="4" r="2.8" fill="none" stroke="url(#bellGoldLinear)" stroke-width="1.4"/>
  <circle cx="24" cy="4" r="1.3" fill="#24201D" opacity="0.35"/>

  <!-- Interlocking Chain Link 1 (Vertical Oval) -->
  <path
    d="M 22.5,4.5 C 22.5,3.2 25.5,3.2 25.5,4.5 V 8.5 C 25.5,9.8 22.5,9.8 22.5,8.5 Z"
    stroke="url(#bellGoldLinear)"
    stroke-width="1.2"
    fill="none"
  />

  <!-- Interlocking Chain Link 2 (Horizontal Ring Accent) -->
  <ellipse cx="24" cy="8.2" rx="3" ry="1.2" fill="url(#bellGoldLinear)" stroke="#765217" stroke-width="0.5"/>

  <!-- Lower Connecting Ring (Loop connecting to Bell Crown) -->
  <circle cx="24" cy="11.8" r="2.5" fill="none" stroke="url(#bellGoldLinear)" stroke-width="1.3"/>
  <circle cx="24" cy="11.8" r="0.9" fill="#8F241C"/>

  <!-- ============================================================ -->
  <!-- 2. TIERED CROWN & FINIAL CAP (ঘণ্টার শিরোমুকুট)              -->
  <!-- ============================================================ -->
  <!-- Conical Crown Pedestal (Kalasa-style finial neck) -->
  <path
    d="M 21.5,13.8 L 26.5,13.8 L 27.8,16.2 L 20.2,16.2 Z"
    fill="url(#bellGoldLinear)"
    stroke="#765217"
    stroke-width="0.6"
  />

  <!-- Upper Inset Crimson Collar Disc -->
  <ellipse cx="24" cy="14.2" rx="3.2" ry="1" fill="url(#bellCrimsonGrad)"/>

  <!-- Flared Terracotta/Brass Umbrella Canopy (ছত্রাকার চূড়া) -->
  <ellipse cx="24" cy="16.2" rx="8.5" ry="2.4" fill="url(#bellGoldLinear)" stroke="#765217" stroke-width="0.7"/>
  <ellipse cx="24" cy="16" rx="7" ry="1.7" fill="url(#bellCrimsonGrad)"/>
  <circle cx="24" cy="15.8" r="1.1" fill="#FAF0CE"/>

  <!-- ============================================================ -->
  <!-- 3. MAIN RESONATING BELL DOME BODY (ঘণ্টার মূল অবয়ব)          -->
  <!-- ============================================================ -->
  <!-- Smoothly Tapering Parabolic Waist & Flaring Lip -->
  <path
    d="
      M 17,17
      C 17,15.5 31,15.5 31,17
      C 30,22 31.5,25.5 34,28.5
      C 36.5,31.5 40,33 40,35.5
      C 40,37.2 33,38.2 24,38.2
      C 15,38.2 8,37.2 8,35.5
      C 8,33 11.5,31.5 14,28.5
      C 16.5,25.5 18,22 17,17
      Z
    "
    fill="url(#bellDomeShine)"
    stroke="#765217"
    stroke-width="1.3"
    stroke-linejoin="round"
  />

  <!-- Specular Highlight Streak (বাম পার্শ্বের উজ্জ্বল আলোকরেখা) -->
  <path
    d="
      M 16,19
      C 17,23 15.5,27 13.5,30.5
      C 12.5,32 11.2,33.2 10.5,34.5
    "
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.65"
    fill="none"
  />

  <!-- ============================================================ -->
  <!-- 4. LITURGICAL RELIEF EMBELLISHMENTS & GIRDLES (নকশাদার বেড়) -->
  <!-- ============================================================ -->
  <!-- Upper Filigree Girdle Band -->
  <path
    d="M 17.5,21.5 C 19.5,22.8 28.5,22.8 30.5,21.5"
    stroke="#765217"
    stroke-width="0.8"
    fill="none"
  />
  <path
    d="M 17,23 C 19.5,24.4 28.5,24.4 31,23"
    stroke="#8F241C"
    stroke-width="0.9"
    fill="none"
  />

  <!-- Middle Sacred Eye / Tri-Leaf Motif (ত্রিদল আলপনা নকশা) -->
  <circle cx="24" cy="25.2" r="1.5" fill="#8F241C" stroke="url(#bellGoldLinear)" stroke-width="0.5"/>
  <circle cx="19.5" cy="25.8" r="1.1" fill="url(#bellGoldLinear)"/>
  <circle cx="28.5" cy="25.8" r="1.1" fill="url(#bellGoldLinear)"/>

  <!-- Lower Flared Girdle Band with Incised Crimson Ribbon -->
  <path
    d="M 12.8,31.8 C 16.5,34 31.5,34 35.2,31.8"
    stroke="#765217"
    stroke-width="1"
    fill="none"
  />
  <path
    d="M 11.5,33.5 C 15.5,35.8 32.5,35.8 36.5,33.5"
    stroke="#8F241C"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Dentil/Beaded Rafter Studs above the Rim (মুক্তাদানা মালা) -->
  <g fill="#FAF0CE" opacity="0.9">
    <circle cx="13" cy="33.8" r="0.75"/>
    <circle cx="16.5" cy="34.8" r="0.8"/>
    <circle cx="20.2" cy="35.3" r="0.85"/>
    <circle cx="24" cy="35.5" r="0.85"/>
    <circle cx="27.8" cy="35.3" r="0.85"/>
    <circle cx="31.5" cy="34.8" r="0.8"/>
    <circle cx="35" cy="33.8" r="0.75"/>
  </g>

  <!-- Heavy Cast Brass Sound Rim (ঘণ্টার গম্ভীর বাদন কানা) -->
  <ellipse cx="24" cy="36.4" rx="16.2" ry="3.6" fill="url(#bellGoldLinear)" stroke="#765217" stroke-width="1.2"/>
  <!-- Hollow Inner Aperture (ঘণ্টার গভীর গর্ভমুখ) -->
  <ellipse cx="24" cy="36.4" rx="14.2" ry="2.5" fill="url(#bellCavityShadow)"/>

  <!-- ============================================================ -->
  <!-- 5. CLAPPER & CONSECRATED SILK TASSEL (লোলক ও রেশমি ঝালর)     -->
  <!-- ============================================================ -->
  <!-- Clapper Suspension Rod (লোলক দণ্ড) -->
  <line x1="24" y1="36" x2="24" y2="40.5" stroke="url(#bellGoldLinear)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="36" x2="24" y2="40.5" stroke="#765217" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Heavy Spherical Striker Ball (লোলক গোলক) -->
  <circle cx="24" cy="41.2" r="3.4" fill="url(#bellCrimsonGrad)" stroke="url(#bellGoldLinear)" stroke-width="1"/>
  <!-- Polished Spherical Highlight -->
  <circle cx="23" cy="40.2" r="1.1" fill="#FFFDF7" opacity="0.85"/>

  <!-- Consecrated Silk Tassel Knot & Spreading Fringe (মঙ্গল রেশমি ঝালর) -->
  <!-- Brass Binding Ferrule -->
  <rect x="22.5" y="44" width="3" height="1.2" rx="0.5" fill="url(#bellGoldLinear)" stroke="#765217" stroke-width="0.4"/>
  <!-- Tassel Silk Threads -->
  <path
    d="
      M 23,45.2
      L 20.5,47.8
      C 22.5,47.2 25.5,47.2 27.5,47.8
      L 25,45.2
      Z
    "
    fill="#C86A12"
  />
  <line x1="24" y1="45.2" x2="24" y2="47.6" stroke="#FAF0CE" stroke-width="0.6"/>
</svg>
