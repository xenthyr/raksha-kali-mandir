<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="48"
  height="48"
  fill="none"
  xml:space="preserve"
>
  <title>ঐতিহাসিক ঢাক প্রতীক (Sacred Dhaak Icon)</title>
  <desc>Traditional Bengali festival Dhaak drum icon with turned wood barrel, parchment drumhead, woven cane hoop, leather tension bracings, brass tuning rings, egret feather plumes, and cane sticks for Sri Sri Maa Raksha Kali Mandir. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Turned Mango-Wood Barrel Lustre (রক্তিম পালিশ কাষ্ঠ পিপা) -->
    <linearGradient id="dhkWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BA3327"/>
      <stop offset="22%" stop-color="#8F241C"/>
      <stop offset="65%" stop-color="#65120D"/>
      <stop offset="100%" stop-color="#3D0B08"/>
    </linearGradient>

    <!-- Natural Parchment Drumhead Membrane (স্বাভাবিক চামড়ার পুট) -->
    <radialGradient id="dhkParchment" cx="42%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFDF7"/>
      <stop offset="78%" stop-color="#F5E8D0"/>
      <stop offset="100%" stop-color="#DEC5A2"/>
    </radialGradient>

    <!-- Burnished Temple Brass / Gold Accents (পিতলের কড়ি ও বেড়) -->
    <linearGradient id="dhkGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0CE"/>
      <stop offset="30%" stop-color="#E5C16C"/>
      <stop offset="70%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>

    <!-- Ceremonial Silk Shoulder Sash (লাল পাটসুতো ও গালবন্ধনী) -->
    <linearGradient id="dhkSashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C86A12"/>
      <stop offset="45%" stop-color="#8F241C"/>
      <stop offset="100%" stop-color="#550E09"/>
    </linearGradient>

    <!-- Ground Contact Shadow -->
    <radialGradient id="dhkFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24201D" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#24201D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#24201D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. FLOOR SHADOW & CEREMONIAL SHOULDER SASH                  -->
  <!-- ============================================================ -->
  <!-- Floor Contact Shadow -->
  <ellipse cx="23" cy="41" rx="19" ry="3.5" fill="url(#dhkFloorShadow)"/>

  <!-- Draped Red & Gold Silk Shoulder Sash (ঢাকের ঝুলন্ত গালবন্ধনী) -->
  <path
    d="
      M 11,26
      C 6,29 6,37 13,40
      C 18,42 22,38 21,34
      C 14,35 11,32 11,26
      Z
    "
    fill="url(#dhkSashGrad)"
    stroke="url(#dhkGoldLinear)"
    stroke-width="0.6"
  />
  <path d="M 9,33 Q 13,38 18,37" stroke="url(#dhkGoldLinear)" stroke-width="0.6" stroke-dasharray="1 1" fill="none"/>

  <!-- ============================================================ -->
  <!-- 2. TRADITIONAL DHAAK BARREL & TENSION ASSEMBLY              -->
  <!-- Rotated -12° for dynamic ritual performance posture          -->
  <!-- ============================================================ -->
  <g id="dhaakInstrument" transform="translate(23, 24) rotate(-12) translate(-23, -24)">

    <!-- A. Turned Wood Barrel Shell (ঢাকের খোল) -->
    <path
      d="
        M 13,11
        C 24,7 35,9 35,16
        L 35,32
        C 35,39 24,41 13,37
        Z
      "
      fill="url(#dhkWoodGrad)"
      stroke="#24201D"
      stroke-width="1.3"
      stroke-linejoin="round"
    />

    <!-- Barrel Woodgrain Highlights -->
    <path d="M 17,11.5 C 24,9.5 31,11 32,15.5" stroke="#FFFFFF" stroke-width="0.75" stroke-linecap="round" opacity="0.35" fill="none"/>
    <path d="M 18,17 C 25,16 30,17 33,20" stroke="#FAF0CE" stroke-width="0.5" stroke-linecap="round" opacity="0.3" fill="none"/>

    <!-- Central Brass Hoops (পিপার শক্ত বাঁধন বেড়) -->
    <path d="M 23,9.5 C 30,11 31,37 23,38.5" stroke="url(#dhkGoldLinear)" stroke-width="1.4" fill="none"/>
    <path d="M 28,11 C 33,13 34,35 28,37" stroke="url(#dhkGoldLinear)" stroke-width="1.1" fill="none"/>

    <!-- B. Striking Head Membrane & Woven Cane Hoop (বাম বাদন চর্ম ও কাণি) -->
    <!-- Outer Woven Cane Hoop (বেতের কাণি) -->
    <ellipse cx="13" cy="24" rx="4.6" ry="13.2" fill="#765217" stroke="url(#dhkGoldLinear)" stroke-width="1.1"/>
    <!-- Parchment Skin Membrane (ছামড়া) -->
    <ellipse cx="12.6" cy="24" rx="3.8" ry="12.2" fill="url(#dhkParchment)" stroke="#B08A3E" stroke-width="0.6"/>
    <!-- Centered Acoustic Strike Spot (বাদন কেন্দ্র) -->
    <ellipse cx="12.5" cy="24" rx="1.8" ry="6.2" fill="#E2CCAB" opacity="0.75"/>

    <!-- C. Passive Rear Head Membrane (ডান কান্ঠা) -->
    <ellipse cx="35" cy="24" rx="2" ry="8.2" fill="#765217" stroke="url(#dhkGoldLinear)" stroke-width="0.9"/>
    <ellipse cx="35.2" cy="24" rx="1.3" ry="7.2" fill="#C8B291"/>

    <!-- D. High-Tension Leather Bracings in Authentic V-Lacing (বদ্দি বাঁধা) -->
    <g stroke="#FFFDF7" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" fill="none">
      <path d="M 13.5,12 L 34.5,17 L 13.5,18 L 34.5,24 L 13.5,24 L 34.5,31 L 13.5,30 L 34.5,24 L 13.5,36"/>
    </g>

    <!-- Secondary Structural Bracing Shadows -->
    <g stroke="#24201D" stroke-width="0.45" opacity="0.45" fill="none">
      <path d="M 13.5,12.6 L 34.5,17.6 M 13.5,18.6 L 34.5,24.6 M 13.5,30.6 L 34.5,24.6"/>
    </g>

    <!-- E. Burnished Brass Tuning Rings (পিতলের কড়ি) -->
    <g fill="url(#dhkGoldLinear)" stroke="#694611" stroke-width="0.4">
      <circle cx="21" cy="14.8" r="1.5"/>
      <circle cx="27" cy="20.5" r="1.5"/>
      <circle cx="20.5" cy="26.8" r="1.5"/>
      <circle cx="28.5" cy="30.2" r="1.5"/>
    </g>

    <!-- F. Egret Feather & Kash Grass Plumes (ঐতিহাসিক বকের পালক ও শনের সাজ) -->
    <g id="featherPlumes">
      <!-- Shadow Under-Plumes -->
      <path d="M 34.5,15 C 43,9 47,15 37,18" stroke="#D8C8B0" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M 35,20 C 47,14 49,24 37,25" stroke="#D8C8B0" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 34.5,25 C 46,24 47,33 36,31" stroke="#D8C8B0" stroke-width="2.6" stroke-linecap="round" fill="none"/>

      <!-- Brilliant White Silk/Feather Tufts -->
      <path d="M 34.5,14.5 C 43.5,8 48,14.5 37.5,17.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 35,19.5 C 47.5,13 49.5,23.5 37.5,24.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 34.5,24.5 C 46.5,23 47.5,32.5 36.5,30.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 34,29 C 43,32 45,38 35,35" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Festive Crimson & Gold Ferrule Binding -->
      <rect x="33.8" y="15" width="2.4" height="18" rx="0.8" fill="#8F241C" stroke="url(#dhkGoldLinear)" stroke-width="0.5"/>
      <circle cx="35" cy="24" r="0.9" fill="url(#dhkGoldLinear)"/>
    </g>

    <!-- G. Slender Cane Drumsticks (ঢাকের কাঠি) -->
    <!-- Primary Striking Stick (বাদনরত কাঠি) -->
    <path d="M 2.5,15 L 12.5,22.5" stroke="#FAF0CE" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 2.5,15 L 5.5,17.2" stroke="#8F241C" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12.5" cy="22.5" r="1.1" fill="url(#dhkGoldLinear)"/>

    <!-- Auxiliary Resonating Stick (সহায়ক কাঠি) -->
    <path d="M 4,31 L 12,25.5" stroke="#FAF0CE" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4,31 L 7,29" stroke="#8F241C" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="25.5" r="1.1" fill="url(#dhkGoldLinear)"/>
  </g>
</svg>
