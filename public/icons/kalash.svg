<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 48 48"
  width="48"
  height="48"
  fill="none"
  xml:space="preserve"
>
  <title>পূর্ণকুম্ভ কলস প্রতীক (Sacred Purna Kalasa Icon)</title>
  <desc>Realistic sacred temple brass Purna Kalasa icon featuring a polished urn belly with incised temple friezes, flared rim, layered auspicious mango leaves (Amrapallava), consecrated coconut (Sriphal) with coir fiber texture and apical tuft, resting on a flanged base pedestal. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Multi-Stage Burnished Brass / Gold Radial Lustre (পিতলের ধাতব দ্যুতি) -->
    <radialGradient id="klsBrassShine" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="20%" stop-color="#F9EEC8"/>
      <stop offset="48%" stop-color="#D9B15B"/>
      <stop offset="78%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </radialGradient>

    <!-- Linear Gold Accent Gradient -->
    <linearGradient id="klsGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0CE"/>
      <stop offset="30%" stop-color="#E5C16C"/>
      <stop offset="70%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>

    <!-- Deep Crimson Shading Gradient (পবিত্র লাল সুতো ও বন্ধনী) -->
    <linearGradient id="klsCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8261C"/>
      <stop offset="50%" stop-color="#8F241C"/>
      <stop offset="100%" stop-color="#5E0F0A"/>
    </linearGradient>

    <!-- Natural Coconut Husk Texture Gradient (শ্রীফল / নারকেল) -->
    <radialGradient id="klsCoconutGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#A85725"/>
      <stop offset="40%" stop-color="#8F3E14"/>
      <stop offset="80%" stop-color="#652309"/>
      <stop offset="100%" stop-color="#381004"/>
    </radialGradient>

    <!-- Auspicious Mango Leaves Gradient (আম্রপল্লব সবুজ ছটা) -->
    <linearGradient id="klsLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FA879"/>
      <stop offset="45%" stop-color="#3D7347"/>
      <stop offset="80%" stop-color="#224A29"/>
      <stop offset="100%" stop-color="#142B18"/>
    </linearGradient>

    <!-- Floor Drop Shadow Under Base Pedestal -->
    <radialGradient id="klsFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24201D" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#24201D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#24201D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. FLOOR SHADOW & BRASS PEDESTAL BASE (পিতলের পাদান বেদি)   -->
  <!-- ============================================================ -->
  <!-- Soft Cast Floor Shadow -->
  <ellipse cx="24" cy="43" rx="15" ry="3" fill="url(#klsFloorShadow)"/>

  <!-- Flanged Bottom Footing Ring (কলসের অধোবলয়) -->
  <ellipse cx="24" cy="42" rx="12" ry="2.6" fill="url(#klsGoldLinear)" stroke="#694611" stroke-width="0.75"/>
  <ellipse cx="24" cy="41.5" rx="10" ry="1.8" fill="#24201D" opacity="0.35"/>

  <!-- Tiered Molded Pedestal Mount -->
  <path
    d="
      M 16,41.5
      C 17,39 20.5,37 21.5,35.5
      L 26.5,35.5
      C 27.5,37 31,39 32,41.5
      Z
    "
    fill="url(#klsBrassShine)"
    stroke="#694611"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- ============================================================ -->
  <!-- 2. SPHERICAL KALASA BELLY & INCISED FRIEZES (পূর্ণকলস কুন্তল)  -->
  <!-- ============================================================ -->
  <!-- Main Rounded Urn Body (স্ফীত উদর) -->
  <circle
    cx="24"
    cy="27"
    r="11"
    fill="url(#klsBrassShine)"
    stroke="#694611"
    stroke-width="1.2"
  />

  <!-- Specular High-Gloss Metallic Highlight Streak -->
  <path
    d="M 16,20 C 14,22 14,26 16.5,30"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.65"
    fill="none"
  />

  <!-- Incised Temple Frieze Band 1 (উদর বলয়রেখা) -->
  <circle cx="24" cy="27" r="9" fill="none" stroke="#765217" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>

  <!-- Sacred Red & Gold Girdle Ribbon / Mauli (লাল পাটসুতো ও বন্ধনী) -->
  <path
    d="
      M 13.2,27
      C 15,31.5 33,31.5 34.8,27
      C 33,23.5 15,23.5 13.2,27
      Z
    "
    fill="url(#klsCrimsonGrad)"
    stroke="url(#klsGoldLinear)"
    stroke-width="0.8"
  />
  <path d="M 15,27 Q 24,29.5 33,27" stroke="url(#klsGoldLinear)" stroke-width="0.7" fill="none"/>

  <!-- Center Auspicious Vermilion Medallion Bindu -->
  <circle cx="24" cy="27" r="2.2" fill="url(#klsCrimsonGrad)" stroke="url(#klsGoldLinear)" stroke-width="0.6"/>
  <circle cx="24" cy="27" r="0.8" fill="#FFFDF7"/>

  <!-- ============================================================ -->
  <!-- 3. FLARED NECK & RIM (কলসের প্রসারিত গ্রীবা ও কানা)             -->
  <!-- ============================================================ -->
  <!-- Urn Neck -->
  <rect x="20" y="17.5" width="8" height="4" fill="url(#klsBrassShine)" stroke="#694611" stroke-width="0.7"/>
  <line x1="20" y1="19.5" x2="28" y2="19.5" stroke="#765217" stroke-width="0.5"/>

  <!-- Flared Rim Lip -->
  <ellipse cx="24" cy="17.5" rx="8.5" ry="2.6" fill="url(#klsBrassShine)" stroke="#694611" stroke-width="0.9"/>
  <!-- Hollow Mouth Opening Shadow -->
  <ellipse cx="24" cy="17.5" rx="6.5" ry="1.6" fill="#1C1815"/>

  <!-- ============================================================ -->
  <!-- 4. AUSPICIOUS MANGO LEAVES FANNED ARRANGEMENT (আম্রপল্লব)      -->
  <!-- ============================================================ -->
  <g id="amrapallavaLeaves">
    <!-- Back Leaf Left -->
    <path
      d="
        M 22,17
        C 17,14 11,10 12,8
        C 13,6 18,10 22,16
        Z
      "
      fill="url(#klsLeafGrad)"
      stroke="#142B18"
      stroke-width="0.5"
    />
    <!-- Back Leaf Right -->
    <path
      d="
        M 26,17
        C 31,14 37,10 36,8
        C 35,6 30,10 26,16
        Z
      "
      fill="url(#klsLeafGrad)"
      stroke="#142B18"
      stroke-width="0.5"
    />

    <!-- Mid Leaf Left -->
    <path
      d="
        M 23,17
        C 18,12 14,7 16,5
        C 18,3 21,9 23,16
        Z
      "
      fill="url(#klsLeafGrad)"
      stroke="#142B18"
      stroke-width="0.5"
    />
    <!-- Mid Leaf Right -->
    <path
      d="
        M 25,17
        C 30,12 34,7 32,5
        C 30,3 27,9 25,16
        Z
      "
      fill="url(#klsLeafGrad)"
      stroke="#142B18"
      stroke-width="0.5"
    />

    <!-- Center Upright Leaves -->
    <path
      d="
        M 24,17
        C 22,11 20,5 22,3
        C 24,1 26,3 24,17
        Z
      "
      fill="#6FA879"
      stroke="#142B18"
      stroke-width="0.5"
    />
    <path
      d="
        M 24,17
        C 26,11 28,5 26,3
        C 24,1 22,3 24,17
        Z
      "
      fill="#3D7347"
      stroke="#142B18"
      stroke-width="0.5"
    />

    <!-- Leaf Midrib Highlights -->
    <path d="M 21,11 Q 22,14 23,17" stroke="#FAF0CE" stroke-width="0.4" fill="none" opacity="0.75"/>
    <path d="M 27,11 Q 26,14 25,17" stroke="#FAF0CE" stroke-width="0.4" fill="none" opacity="0.75"/>
  </g>

  <!-- ============================================================ -->
  <!-- 5. CONSECRATED COCONUT WITH APICAL TUFT (শ্রীফল / নারকেল)    -->
  <!-- ============================================================ -->
  <g id="sriphalCoconut">
    <!-- Coconut Husk Body (নারকেলের খোলস) -->
    <ellipse
      cx="24"
      cy="10.5"
      rx="5.8"
      ry="7.2"
      fill="url(#klsCoconutGrad)"
      stroke="#381004"
      stroke-width="0.8"
    />

    <!-- Coir Fiber Texture Lines (নারকেলের আঁশ ও জটা) -->
    <g stroke="#381004" stroke-width="0.45" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 21,6 C 22,9 22,12 21,15"/>
      <path d="M 24,5 C 24.5,9 24,13 24.5,16"/>
      <path d="M 27,6 C 26,9 26,12 27,15"/>
      <path d="M 20,8 C 22,10 26,10 28,8"/>
    </g>

    <!-- Specular Highlight on Coconut Husk -->
    <ellipse cx="22" cy="8" rx="1.5" ry="2.5" transform="rotate(-20 22 8)" fill="#FFFDF7" opacity="0.45"/>

    <!-- Sacred Apical Tuft / Shikha (নারকেলের ছোট চূড়া বা শিকখা) -->
    <path
      d="
        M 24,3.3
        C 22,1.5 21,0.5 20,0
        C 22,1.5 23,2.5 24,3.3
        C 25,2.5 26,1.5 28,0
        C 27,0.5 26,1.5 24,3.3
        Z
      "
      fill="#8F241C"
      stroke="url(#klsGoldLinear)"
      stroke-width="0.4"
    />
    <path d="M 24,3.3 L 24,0.5" stroke="#FAF0CE" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Consecrated Vermilion Tilak on Coconut Apex -->
    <circle cx="24" cy="5" rx="1" ry="0.8" fill="url(#klsCrimsonGrad)" stroke="url(#klsGoldLinear)" stroke-width="0.3"/>
  </g>
</svg>
