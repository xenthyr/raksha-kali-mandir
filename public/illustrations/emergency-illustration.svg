<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 480 360"
  width="480"
  height="360"
  fill="none"
  xml:space="preserve"
>
  <title>জরুরি সহায়তা ও ভক্ত সেবা কেন্দ্র — চিত্রলিপি</title>
  <desc>Emergency assistance, pilgrim safety, medical aid, lost and found, and devotee support desk illustration for Sri Sri Maa Raksha Kali Mandir. Canonical 5-Color System. Design state: DESIGN_RUNTIME.</desc>

  <!-- ============================================================ -->
  <!-- DEFINITIONS: PALETTES, PATTERNS & GRADIENTS                  -->
  <!-- ============================================================ -->
  <defs>
    <!-- Background: Luminous Sacred Ivory Parchment Gradient -->
    <radialGradient id="emCanvasBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#FDFBF5"/>
      <stop offset="78%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#EFE0C7"/>
    </radialGradient>

    <!-- Subtle Traditional Bengali Alpana Lace Texture Overlay -->
    <pattern id="emAlpanaTile" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 30 15 L 15 30 L 0 15 Z" fill="none" stroke="#B08A3E" stroke-width="0.45" stroke-opacity="0.12"/>
      <circle cx="15" cy="15" r="4.5" fill="none" stroke="#8F241C" stroke-width="0.4" stroke-opacity="0.08"/>
      <circle cx="15" cy="15" r="1.2" fill="#B08A3E" fill-opacity="0.18"/>
    </pattern>

    <!-- Divine Protection Aura Glow -->
    <radialGradient id="emShieldAura" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#FFDE8A" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#C86A12" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#8F241C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FBF4E6" stop-opacity="0"/>
    </radialGradient>

    <!-- Burnished Temple Brass / Gold Multi-Stop Gradient -->
    <linearGradient id="emGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9EEC8"/>
      <stop offset="25%" stop-color="#D9B15B"/>
      <stop offset="65%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#765217"/>
    </linearGradient>

    <!-- Deep Crimson Shading Gradient -->
    <linearGradient id="emCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8261C"/>
      <stop offset="50%" stop-color="#8F241C"/>
      <stop offset="100%" stop-color="#65120D"/>
    </linearGradient>

    <!-- Sacred Flame Multi-Stage Gradient -->
    <linearGradient id="emFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#731610"/>
      <stop offset="25%" stop-color="#8F241C"/>
      <stop offset="70%" stop-color="#C86A12"/>
      <stop offset="100%" stop-color="#F5C042"/>
    </linearGradient>

    <!-- Ornate Temple Corner Filigree Macro -->
    <g id="emCornerFiligree">
      <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="url(#emGoldGrad)" opacity="0.9"/>
      <path d="M 3,3 L 21,3 C 21,12 12,21 3,21 Z" fill="#FBF4E6"/>
      <circle cx="8" cy="8" r="2.2" fill="#8F241C"/>
      <path d="M 0,28 L 28,0" stroke="#8F241C" stroke-width="1.2" opacity="0.8"/>
    </g>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. BASE CANVAS & NOTARIAL SECURITY BORDERS                   -->
  <!-- ============================================================ -->
  <!-- Ivory Canvas -->
  <rect width="480" height="360" rx="16" fill="url(#emCanvasBg)"/>
  <rect width="480" height="360" rx="16" fill="url(#emAlpanaTile)"/>

  <!-- Outer Deep Crimson Enclosure Frame -->
  <rect x="12" y="12" width="456" height="336" rx="14" fill="none" stroke="#8F241C" stroke-width="2.6"/>

  <!-- Inner Burnished Brass Guard Rail -->
  <rect x="18" y="18" width="444" height="324" rx="10" fill="none" stroke="url(#emGoldGrad)" stroke-width="1.4"/>

  <!-- Guilloché Beaded Tracking Line -->
  <rect x="23" y="23" width="434" height="314" rx="7" fill="none" stroke="#8F241C" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.6"/>

  <!-- Four Ornamental Corner Brackets -->
  <use xlink:href="#emCornerFiligree" x="23" y="23"/>
  <use xlink:href="#emCornerFiligree" x="457" y="23" transform="rotate(90 457 23)"/>
  <use xlink:href="#emCornerFiligree" x="457" y="337" transform="rotate(180 457 337)"/>
  <use xlink:href="#emCornerFiligree" x="23" y="337" transform="rotate(270 23 337)"/>

  <!-- Top Identification Badge -->
  <g transform="translate(240, 38)">
    <rect x="-135" y="-12" width="270" height="24" rx="12" fill="#8F241C" stroke="url(#emGoldGrad)" stroke-width="1.2"/>
    <text
      x="0"
      y="1"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif"
      font-size="11"
      font-weight="700"
      fill="#FFFDF7"
      letter-spacing="0.6"
      text-rendering="geometricPrecision"
    >
      ★ শ্রী শ্রী মা রক্ষা কালী মন্দির ★
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- 2. CENTRAL HERO: HERALDIC PROTECTION SHIELD & CHATTRA        -->
  <!-- ============================================================ -->
  <!-- Protective Celestial Halo Aura -->
  <circle cx="240" cy="162" r="140" fill="url(#emShieldAura)"/>

  <!-- Sacred Chattra / Royal Protective Canopy (ছত্র) -->
  <g id="sacredChattra" transform="translate(240, 52)">
    <!-- Finial Staff & Gold Kalasa -->
    <line x1="0" y1="-14" x2="0" y2="18" stroke="url(#emGoldGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="3" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.8"/>
    <circle cx="0" cy="-14" r="1.2" fill="#8F241C"/>

    <!-- Flared Silk Dome Canopy -->
    <path
      d="
        M -38,18
        C -38,-4 38,-4 38,18
        Z
      "
      fill="url(#emGoldGrad)"
      stroke="#765217"
      stroke-width="1.2"
    />
    <!-- Inlaid Crimson Scallops on Dome -->
    <path
      d="
        M -32,18
        C -32,2 32,2 32,18
        Z
      "
      fill="url(#emCrimsonGrad)"
      stroke="#765217"
      stroke-width="0.6"
    />

    <!-- Hanging Pearl Drops & Miniature Gold Tassels -->
    <g stroke="url(#emGoldGrad)" stroke-width="1" stroke-linecap="round">
      <line x1="-32" y1="18" x2="-32" y2="23"/><circle cx="-32" cy="24" r="1.5" fill="#FFFDF7"/>
      <line x1="-16" y1="18" x2="-16" y2="25"/><circle cx="-16" cy="26" r="1.5" fill="#FFFDF7"/>
      <line x1="0" y1="18" x2="0" y2="27"/><circle cx="0" cy="28" r="1.8" fill="#FFFDF7"/>
      <line x1="16" y1="18" x2="16" y2="25"/><circle cx="16" cy="26" r="1.5" fill="#FFFDF7"/>
      <line x1="32" y1="18" x2="32" y2="23"/><circle cx="32" cy="24" r="1.5" fill="#FFFDF7"/>
    </g>
  </g>

  <!-- Sacred Heraldic Shield of Abhaya Protection (অভয় রক্ষাকবচ শিল্ড) -->
  <g id="heraldicShield">
    <!-- Outer Crimson Shield Frame with Pointed Base -->
    <path
      d="
        M 240,78
        L 344,110
        C 344,188 240,246 240,246
        C 240,246 136,188 136,110
        Z
      "
      fill="url(#emCrimsonGrad)"
      stroke="url(#emGoldGrad)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Shield Perimeter Studs / Brass Rivets (১৬টি সুরক্ষাবলয় মুদ্রা) -->
    <g fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.5">
      <circle cx="190" cy="94" r="2.2"/><circle cx="240" cy="84" r="2.2"/><circle cx="290" cy="94" r="2.2"/>
      <circle cx="148" cy="122" r="2.2"/><circle cx="332" cy="122" r="2.2"/>
      <circle cx="156" cy="150" r="2.2"/><circle cx="324" cy="150" r="2.2"/>
      <circle cx="174" cy="178" r="2.2"/><circle cx="306" cy="178" r="2.2"/>
      <circle cx="198" cy="204" r="2.2"/><circle cx="282" cy="204" r="2.2"/>
      <circle cx="222" cy="226" r="2.2"/><circle cx="258" cy="226" r="2.2"/>
    </g>

    <!-- Inner Polished Ivory Shield Plate -->
    <path
      d="
        M 240,90
        L 330,118
        C 330,180 240,232 240,232
        C 240,232 150,180 150,118
        Z
      "
      fill="#FFFDF7"
      stroke="url(#emGoldGrad)"
      stroke-width="1.6"
      stroke-linejoin="round"
    />

    <!-- Subtle Shield Pinstripe -->
    <path
      d="
        M 240,98
        L 320,124
        C 320,174 240,222 240,222
        C 240,222 160,174 160,124
        Z
      "
      fill="none"
      stroke="#B08A3E"
      stroke-width="0.8"
      stroke-dasharray="2 2"
      opacity="0.65"
    />

    <!-- ========================================================== -->
    <!-- 3. CENTRAL RELIEF EMBLEM: MEDICAL CROSS + TRISHULA JYOTI    -->
    <!-- Center: X = 240, Y = 160                                    -->
    <!-- ========================================================== -->
    <!-- Radiating Eight-Pointed Golden Blessing Star -->
    <path
      d="
        M 240,114 L 244,152 L 282,146 L 246,164 L 274,196 L 240,170 L 206,196 L 234,164 L 198,146 L 236,152 Z
      "
      fill="url(#emGoldGrad)"
      opacity="0.3"
    />

    <!-- Devotional Medical Relief Cross (চিকিৎসা ও ত্রাণ ক্রুশ) -->
    <g transform="translate(240, 160)">
      <!-- Classical Equal-Arm Relief Cross -->
      <path
        d="
          M -13,-36 H 13 V -13 H 36 V 13 H 13 V 36 H -13 V 13 H -36 V -13 H -13 Z
        "
        fill="url(#emCrimsonGrad)"
        stroke="url(#emGoldGrad)"
        stroke-width="1.6"
        stroke-linejoin="round"
      />

      <!-- Inner Cross Border Line -->
      <path
        d="
          M -10,-33 H 10 V -10 H 33 V 10 H 10 V 33 H -10 V 10 H -33 V -10 H -10 Z
        "
        fill="none"
        stroke="#FFFDF7"
        stroke-width="0.8"
        opacity="0.85"
      />

      <!-- Consecrated Raksha Kali Golden Trishula & Jyoti at Cross Center -->
      <!-- Center Gold Medallion Ring -->
      <circle cx="0" cy="0" r="9" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.8"/>
      <!-- Inner Vermilion Core -->
      <circle cx="0" cy="0" r="6" fill="#8F241C"/>

      <!-- Miniature Sacred Jyoti Flame Inside Cross -->
      <path
        d="
          M 0,-18
          C 4,-12 7,-6 7,0
          C 7,5 4,8 0,9
          C -4,8 -7,5 -7,0
          C -7,-6 -4,-12 0,-18
          Z
        "
        fill="url(#emFlameGrad)"
      />
      <circle cx="0" cy="0" r="2.2" fill="#FFFDF7"/>
      <circle cx="0" cy="0" r="1" fill="#8F241C"/>

      <!-- Flanking Protective Wing/Lotus Petals Supporting Cross -->
      <path d="M -13,36 C -20,44 -32,38 -34,26" stroke="url(#emGoldGrad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M 13,36 C 20,44 32,38 34,26" stroke="url(#emGoldGrad)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Lotus Pedestal Supporting the Shield Interior Base -->
    <path
      d="
        M 216,214
        C 224,206 232,206 240,214
        C 248,206 256,206 264,214
        C 256,220 248,222 240,222
        C 232,222 224,220 216,214
        Z
      "
      fill="url(#emGoldGrad)"
      stroke="#765217"
      stroke-width="0.8"
    />
  </g>

  <!-- ============================================================ -->
  <!-- 4. LEFT WING: FIRST AID / MEDICAL KIT (প্রাথমিক চিকিৎসা)      -->
  <!-- Center: X = 88, Y = 186                                      -->
  <!-- ============================================================ -->
  <g id="firstAidKit" transform="translate(88, 186)">
    <!-- Cast Shadow -->
    <ellipse cx="0" cy="30" rx="30" ry="6" fill="#24201D" opacity="0.32"/>

    <!-- Medical Box Body -->
    <rect x="-26" y="-6" width="52" height="34" rx="6" fill="#FFFDF7" stroke="url(#emGoldGrad)" stroke-width="1.4"/>
    <rect x="-26" y="-6" width="52" height="10" rx="4" fill="#8F241C"/>

    <!-- Brass Handle on Top -->
    <path d="M -10,-6 C -10,-14 10,-14 10,-6" fill="none" stroke="url(#emGoldGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Brass Clasps & Rim -->
    <rect x="-14" y="2" width="5" height="5" rx="1" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.5"/>
    <rect x="9" y="2" width="5" height="5" rx="1" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.5"/>

    <!-- Distinct Red Relief Cross on White Box Surface -->
    <path
      d="
        M -3,11 H 3 V 5 H 9 V 11 H 15 V 17 H 9 V 23 H 3 V 17 H -3 V 11 Z
      "
      fill="#8F241C"
      stroke="url(#emGoldGrad)"
      stroke-width="0.6"
      transform="translate(-6, -2)"
    />

    <!-- Healing Sanjeevani Herb Sprig Resting on Kit (সঞ্জীবনী লতা) -->
    <g transform="translate(14, 18) rotate(25)">
      <path d="M 0,0 C 0,-12 8,-18 12,-24" stroke="#3D7347" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M 2,-6 C -2,-10 0,-16 6,-14 Z" fill="#4C8556"/>
      <path d="M 6,-14 C 10,-18 16,-16 14,-10 Z" fill="#4C8556"/>
      <circle cx="12" cy="-24" r="1.5" fill="url(#emGoldGrad)"/>
    </g>

    <!-- Label Below Kit -->
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans Bengali', sans-serif" font-size="9" font-weight="700" fill="#8F241C">
      প্রাথমিক চিকিৎসা
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- 5. RIGHT WING: PILGRIM ASSISTANCE & SAFETY BEACON            -->
  <!-- Center: X = 392, Y = 186                                     -->
  <!-- ============================================================ -->
  <g id="pilgrimAssistanceDesk" transform="translate(392, 186)">
    <!-- Cast Shadow -->
    <ellipse cx="0" cy="30" rx="30" ry="6" fill="#24201D" opacity="0.32"/>

    <!-- Brass Safety Bell & Guidance Pillar Stand -->
    <path d="M -18,28 L 18,28 L 12,20 L -12,20 Z" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.8"/>
    <rect x="-4" y="6" width="8" height="15" fill="url(#emGoldGrad)" stroke="#765217" stroke-width="0.8"/>
    <ellipse cx="0" cy="6" rx="12" ry="4" fill="url(#emGoldGrad)"/>

    <!-- Consecrated Directional Lantern / Beacon (সহায়তা নির্দেশক দীপ) -->
    <path
      d="
        M -12,5 L 12,5 L 8,-18 L -8,-18 Z
      "
      fill="#FFFDF7"
      stroke="url(#emGoldGrad)"
      stroke-width="1.2"
    />
    <!-- Glowing Amber Core Within Lantern -->
    <circle cx="0" cy="-6" r="6" fill="#F5A623" opacity="0.85"/>
    <circle cx="0" cy="-6" r="2" fill="#FFFFFF"/>
    <!-- Radiating Ray Beacons -->
    <line x1="-16" y1="-6" x2="-22" y2="-6" stroke="url(#emGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="16" y1="-6" x2="22" y2="-6" stroke="url(#emGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-12" y1="-16" x2="-18" y2="-20" stroke="url(#emGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="-16" x2="18" y2="-20" stroke="url(#emGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Lantern Domed Roof with Trishula Finial -->
    <path d="M -14,-18 C -14,-26 14,-26 14,-18 Z" fill="url(#emCrimsonGrad)" stroke="url(#emGoldGrad)" stroke-width="1"/>
    <line x1="0" y1="-26" x2="0" y2="-32" stroke="url(#emGoldGrad)" stroke-width="1.5"/>
    <circle cx="0" cy="-33" r="1.8" fill="url(#emGoldGrad)"/>

    <!-- Label Below Beacon -->
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans Bengali', sans-serif" font-size="9" font-weight="700" fill="#8F241C">
      অনুসন্ধান ও নিরাপত্তা
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- 6. DEVOTEE SUPPORT DESK RIBBON (অফিসিয়াল ডেস্ক কার্তুশ)       -->
  <!-- Center: X = 240, Y = 274 | Height: 28px                      -->
  <!-- ============================================================ -->
  <g id="deskRibbon" transform="translate(240, 274)">
    <!-- Cartouche Frame -->
    <rect
      x="-152"
      y="-14"
      width="304"
      height="28"
      rx="14"
      fill="#24201D"
      stroke="url(#emGoldGrad)"
      stroke-width="1.4"
    />
    <rect
      x="-148"
      y="-11"
      width="296"
      height="22"
      rx="11"
      fill="none"
      stroke="#8F241C"
      stroke-width="0.8"
      opacity="0.8"
    />

    <!-- Flanking Star Studs -->
    <circle cx="-136" cy="0" r="2.5" fill="url(#emGoldGrad)"/>
    <circle cx="136" cy="0" r="2.5" fill="url(#emGoldGrad)"/>

    <!-- Ribbon Bengali Inscription -->
    <text
      x="0"
      y="0"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif"
      font-size="12.5"
      font-weight="700"
      fill="#FFFDF7"
      letter-spacing="0.5"
      text-rendering="geometricPrecision"
    >
      ★ ভক্ত সহায়তা ও অভিযোগ নিষ্পত্তি ডেস্ক ★
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- 7. BOTTOM DIVIDER & OFFICIAL INSTITUTIONAL TYPOGRAPHY        -->
  <!-- ============================================================ -->
  <!-- Architectural Gold Baseline Divider -->
  <line x1="45" y1="304" x2="435" y2="304" stroke="url(#emGoldGrad)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="45" cy="304" r="3" fill="#8F241C" stroke="url(#emGoldGrad)" stroke-width="1"/>
  <circle cx="435" cy="304" r="3" fill="#8F241C" stroke="url(#emGoldGrad)" stroke-width="1"/>
  <circle cx="240" cy="304" r="2.5" fill="#8F241C" stroke="url(#emGoldGrad)" stroke-width="0.8"/>

  <!-- Primary Bengali Service Scope Title -->
  <text
    x="240"
    y="323"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif"
    font-size="15.5"
    font-weight="700"
    fill="#8F241C"
    letter-spacing="0.4"
    text-rendering="geometricPrecision"
  >
    জরুরি সেবা • প্রাথমিক চিকিৎসা • নিরাপত্তা ও অনুসন্ধান
  </text>

  <!-- Official Protocol Notice: Zero Private Contact Leakage -->
  <text
    x="240"
    y="341"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#765217"
    letter-spacing="0.3"
    text-rendering="geometricPrecision"
  >
    Official Support Ticket Protocol: MRK-YYYY-NNNNNN • সার্বক্ষণিক সেবা
  </text>
</svg>
