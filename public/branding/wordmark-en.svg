<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 680 136"
  width="680"
  height="136"
  fill="none"
  xml:space="preserve"
>
  <title>Sri Sri Maa Raksha Kali Mandir — English Wordmark</title>
  <desc>Official English wordmark and emblem lockup for Sri Sri Maa Raksha Kali Mandir. Canonical 5-Color System. Location: Sahapur Bat-tala More, Raiganj, Uttar Dinajpur. Design state: DESIGN_RUNTIME.</desc>

  <!-- ============================================================ -->
  <!-- DEFINITIONS: PALETTES, FILTERS & MULTI-STOP GRADIENTS       -->
  <!-- ============================================================ -->
  <defs>
    <!-- Background Ivory Silk Radial Glow -->
    <radialGradient id="wmEnTileBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFDF7"/>
      <stop offset="88%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#F2E5D0"/>
    </radialGradient>

    <!-- Sacred Raksha Kali Flame Multi-Stop Gradient -->
    <linearGradient id="wmEnFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#731610"/>
      <stop offset="25%" stop-color="#8F241C"/>
      <stop offset="70%" stop-color="#C86A12"/>
      <stop offset="100%" stop-color="#E5A642"/>
    </linearGradient>

    <!-- Inner Flame Core Radiance -->
    <linearGradient id="wmEnInnerJyoti" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C86A12"/>
      <stop offset="48%" stop-color="#EAA842"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Temple Brass / Burnished Gold Gradient -->
    <linearGradient id="wmEnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8ECC4"/>
      <stop offset="28%" stop-color="#D7AE56"/>
      <stop offset="65%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#765217"/>
    </linearGradient>

    <!-- Architectural Stambha Divider Gradient -->
    <linearGradient id="wmEnDividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B08A3E" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#B08A3E"/>
      <stop offset="50%" stop-color="#8F241C"/>
      <stop offset="80%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#B08A3E" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Glyphic Clarity -->
    <filter id="wmEnTextGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#8F241C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. LEFT EMBLEM TILE (Centered at X=68, Y=68)                -->
  <!-- ============================================================ -->
  <!-- Rounded Base Tile -->
  <rect x="10" y="10" width="116" height="116" rx="24" fill="url(#wmEnTileBg)" stroke="#8F241C" stroke-width="2.2"/>

  <!-- Concentric Sanctum Guard Rings -->
  <circle cx="68" cy="68" r="47.5" fill="none" stroke="url(#wmEnGoldGrad)" stroke-width="1.4"/>
  <circle cx="68" cy="68" r="49.5" fill="none" stroke="#8F241C" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.55"/>

  <!-- Cardinal & Diagonal Mandala Ray Notches (8 Directions) -->
  <g stroke="url(#wmEnGoldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.75" aria-hidden="true">
    <!-- Cardinal Points -->
    <line x1="68" y1="17" x2="68" y2="19.5"/>
    <line x1="68" y1="116.5" x2="68" y2="119"/>
    <line x1="17" y1="68" x2="19.5" y2="68"/>
    <line x1="116.5" y1="68" x2="119" y2="68"/>
    <!-- Diagonal Points -->
    <line x1="32" y1="32" x2="33.8" y2="33.8"/>
    <line x1="104" y1="104" x2="102.2" y2="102.2"/>
    <line x1="104" y1="32" x2="102.2" y2="33.8"/>
    <line x1="32" y1="104" x2="33.8" y2="102.2"/>
  </g>

  <!-- Sacred Flame & Lotus Pedestal Motif (Offset +8, +8 -> Centered at 68, 68) -->
  <g id="wmEnEmblemMotif" aria-hidden="true" transform="translate(8, 8)">
    <!-- 1. Outer Sacred Flame (Trishula Jyoti) -->
    <path
      d="
        M60 19
        C69 30 79 42 79 56
        C79 69 71 77 60 80
        C49 77 41 69 41 56
        C41 42 51 30 60 19
        Z
      "
      fill="url(#wmEnFlameGrad)"
    />

    <!-- 2. Mid Radiance Layer -->
    <path
      d="
        M60 30
        C66 38 72 47 72 56
        C72 65 66 72 60 74
        C54 72 48 65 48 56
        C48 47 54 38 60 30
        Z
      "
      fill="url(#wmEnInnerJyoti)"
    />

    <!-- 3. Core Sanctum Light -->
    <path
      d="
        M60 41
        C64 47 67 52 67 58
        C67 64 64 68 60 69
        C56 68 53 64 53 58
        C53 52 56 47 60 41
        Z
      "
      fill="#FFFFFF"
    />

    <!-- 4. Divine Vermilion Trinetra / Bindu -->
    <circle cx="60" cy="53" r="2.2" fill="#8F241C"/>
    <circle cx="60" cy="53" r="0.8" fill="#FFFDF7"/>

    <!-- 5. Diya Cup (Flame-to-Pedestal Bridge) -->
    <path
      d="
        M43 75
        C50 78 70 78 77 75
        C74 81 67 83 60 83
        C53 83 46 81 43 75
        Z
      "
      fill="url(#wmEnGoldGrad)"
    />
    <line x1="50" y1="81" x2="70" y2="81" stroke="#8F241C" stroke-width="1" stroke-linecap="round"/>

    <!-- 6. Lotus Pedestal Base (Alpana Wings) -->
    <path
      d="
        M26 84
        C36 75 46 74 60 84
        C74 74 84 75 94 84
        C84 83 74 89 60 94
        C46 89 36 83 26 84
        Z
      "
      fill="url(#wmEnGoldGrad)"
      stroke="#8F241C"
      stroke-width="0.8"
    />

    <!-- 7. Altar Foot Foundation -->
    <path
      d="
        M33 89
        C41 87 50 91 60 96
        C70 91 79 87 87 89
        C80 96 71 101 60 101
        C49 101 40 96 33 89
        Z
      "
      fill="#8F241C"/>
    <path
      d="
        M37 91
        C44 90 52 93 60 97
        C68 93 76 90 83 91
      "
      stroke="url(#wmEnGoldGrad)"
      stroke-width="1.2"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="60" cy="98" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ARCHITECTURAL STAMBHA (DIVIDER PILLAR)                   -->
  <!-- Symmetrically positioned: 26px from Tile, 24px to Text       -->
  <!-- ============================================================ -->
  <line x1="152" y1="18" x2="152" y2="118" stroke="url(#wmEnDividerGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Capital -->
  <circle cx="152" cy="18" r="3.5" fill="#8F241C" stroke="url(#wmEnGoldGrad)" stroke-width="1"/>
  <circle cx="152" cy="18" r="1.2" fill="#FFFFFF"/>
  <!-- Midpoint Knot Ornament -->
  <circle cx="152" cy="68" r="2.8" fill="#B08A3E" stroke="#8F241C" stroke-width="0.8"/>
  <circle cx="152" cy="68" r="1" fill="#FFFFFF"/>
  <!-- Bottom Base -->
  <circle cx="152" cy="118" r="3.5" fill="#8F241C" stroke="url(#wmEnGoldGrad)" stroke-width="1"/>
  <circle cx="152" cy="118" r="1.2" fill="#FFFFFF"/>

  <!-- ============================================================ -->
  <!-- 3. ENGLISH TYPOGRAPHY HIERARCHY (LEFT ALIGNED AT X=176)      -->
  <!-- Baselines calibrated to match the visual rhythm of Bengali  -->
  <!-- ============================================================ -->
  <!-- Primary Title: Canonical Mandir Identity in Classical Serif -->
  <text
    x="176"
    y="48"
    font-family="'Cinzel', 'Trajan Pro', 'Baskerville', 'Georgia', serif"
    font-size="22.5"
    font-weight="700"
    fill="#8F241C"
    letter-spacing="1"
    filter="url(#wmEnTextGlow)"
    text-rendering="geometricPrecision"
  >
    SRI SRI MAA RAKSHA KALI MANDIR
  </text>

  <!-- Secondary Line: Canonical Location Lock with Bat-tala -->
  <text
    x="176"
    y="79"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="15"
    font-weight="600"
    fill="#C86A12"
    letter-spacing="0.4"
    text-rendering="geometricPrecision"
  >
    Sahapur Bat-tala More, Raiganj, Uttar Dinajpur
  </text>

  <!-- Tertiary Line: Consecrated Motto & Established Era -->
  <text
    x="176"
    y="106"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="12"
    font-weight="600"
    fill="#24201D"
    letter-spacing="1.4"
    text-rendering="geometricPrecision"
  >
    ABHAYA • SHANTI • SEVA ★ ESTD. 1433 BS
  </text>
</svg>
