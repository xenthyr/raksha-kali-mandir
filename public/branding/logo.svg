<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 136" width="680" height="136" fill="none">
  <title>শ্রী শ্রী মা রক্ষা কালী মন্দির — DESIGN_RUNTIME</title>
  <desc>Primary Bengali-first temple wordmark and emblem lockup. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Background Ivory Silk Radial Glow -->
    <radialGradient id="logoTileBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#F3E7D3"/>
    </radialGradient>

    <!-- Sacred Raksha Kali Flame (Deep Crimson to Radiant Saffron) -->
    <linearGradient id="logoWordmarkFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F241C"/>
      <stop offset="55%" stop-color="#C86A12"/>
      <stop offset="100%" stop-color="#B08A3E"/>
    </linearGradient>

    <!-- Inner Jyoti Radiant Core -->
    <linearGradient id="logoWordmarkInnerJyoti" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C86A12"/>
      <stop offset="50%" stop-color="#E5A642"/>
      <stop offset="100%" stop-color="#FBF4E6"/>
    </linearGradient>

    <!-- Temple Brass / Gold Gradient -->
    <linearGradient id="logoWordmarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED89B"/>
      <stop offset="50%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#7A591E"/>
    </linearGradient>

    <!-- Vertical Divider Accent Gradient -->
    <linearGradient id="logoDividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B08A3E" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#B08A3E"/>
      <stop offset="50%" stop-color="#8F241C"/>
      <stop offset="75%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#B08A3E" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. LEFT EMBLEM TILE (Centered at X=68, Y=68)                -->
  <!-- ============================================================ -->
  <rect x="10" y="10" width="116" height="116" rx="24" fill="url(#logoTileBg)" stroke="#8F241C" stroke-width="2.2"/>
  <circle cx="68" cy="68" r="47.5" fill="none" stroke="url(#logoWordmarkGold)" stroke-width="1.2"/>
  <circle cx="68" cy="68" r="49.5" fill="none" stroke="#B08A3E" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.55"/>

  <!-- Cardinal Ray Notches -->
  <g stroke="url(#logoWordmarkGold)" stroke-width="1" stroke-linecap="round" opacity="0.65">
    <line x1="68" y1="17.5" x2="68" y2="19.5"/>
    <line x1="68" y1="116.5" x2="68" y2="118.5"/>
    <line x1="17.5" y1="68" x2="19.5" y2="68"/>
    <line x1="116.5" y1="68" x2="118.5" y2="68"/>
  </g>

  <!-- Nested Sacred Flame & Lotus Pedestal Motif (Offset by +8, +8) -->
  <g id="logo-emblem-motif" aria-hidden="true" transform="translate(8, 8)">
    <!-- Outer Sacred Flame (Trishula Jyoti) -->
    <path d="M60 19 C69 30 79 42 79 56 C79 69 71 77 60 80 C49 77 41 69 41 56 C41 42 51 30 60 19 Z" 
          fill="url(#logoWordmarkFlame)"/>

    <!-- Mid Radiance Layer -->
    <path d="M60 30 C66 38 72 47 72 56 C72 65 66 72 60 74 C54 72 48 65 48 56 C48 47 54 38 60 30 Z" 
          fill="url(#logoWordmarkInnerJyoti)"/>

    <!-- Core Sanctum Light -->
    <path d="M60 41 C64 47 67 52 67 58 C67 64 64 68 60 69 C56 68 53 64 53 58 C53 52 56 47 60 41 Z" 
          fill="#FBF4E6"/>

    <!-- Vermilion Trinetra / Bindu -->
    <circle cx="60" cy="53" r="2.2" fill="#8F241C"/>
    <circle cx="60" cy="53" r="0.8" fill="#FBF4E6"/>

    <!-- Diya Cup (Locks Flame to Pedestal) -->
    <path d="M43 75 C50 78 70 78 77 75 C74 81 67 83 60 83 C53 83 46 81 43 75 Z" 
          fill="url(#logoWordmarkGold)"/>
    <line x1="50" y1="81" x2="70" y2="81" stroke="#8F241C" stroke-width="1" stroke-linecap="round"/>

    <!-- Lotus Pedestal (Alpana Wing Base) -->
    <path d="M26 84 C36 75 46 74 60 84 C74 74 84 75 94 84 C84 83 74 89 60 94 C46 89 36 83 26 84 Z" 
          fill="url(#logoWordmarkGold)" stroke="#8F241C" stroke-width="0.8"/>

    <!-- Lower Foundation Arc & Foot -->
    <path d="M33 89 C41 87 50 91 60 96 C70 91 79 87 87 89 C80 96 71 101 60 101 C49 101 40 96 33 89 Z" 
          fill="#8F241C"/>
    <path d="M37 91 C44 90 52 93 60 97 C68 93 76 90 83 91" 
          stroke="url(#logoWordmarkGold)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="98" r="1.2" fill="#FBF4E6"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ARCHITECTURAL DIVIDER RULE                                -->
  <!-- ============================================================ -->
  <line x1="152" y1="22" x2="152" y2="114" stroke="url(#logoDividerGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="152" cy="22" r="2.2" fill="#8F241C"/>
  <circle cx="152" cy="114" r="2.2" fill="#8F241C"/>

  <!-- ============================================================ -->
  <!-- 3. WORDMARK TYPOGRAPHY (Bengali-First Hierarchy)             -->
  <!-- ============================================================ -->
  <!-- Primary Title: Canonical Deity & Mandir Name -->
  <text x="176" y="50" 
        font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#8F241C" 
        letter-spacing="0.3">
    শ্রী শ্রী মা রক্ষা কালী মন্দির
  </text>

  <!-- Secondary Line: Canonical Locality Lock -->
  <text x="176" y="79" 
        font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif" 
        font-size="15" 
        font-weight="600" 
        fill="#C86A12" 
        letter-spacing="0.4">
    সাহাপুর বটতলা মোড়, রায়গঞ্জ, উত্তর দিনাজপুর
  </text>

  <!-- Tertiary Line: Sacred Motto & Established Era -->
  <text x="176" y="105" 
        font-family="'Noto Sans Bengali', 'SolaimanLipi', 'Nirmala UI', sans-serif" 
        font-size="12" 
        font-weight="500" 
        fill="#24201D" 
        letter-spacing="0.3">
    অভয় • শান্তি • সেবা ★ নিত্য ও অমাবস্যা পরিক্রমা
  </text>
</svg>
