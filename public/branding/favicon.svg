<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <title>মা রক্ষা কালী — DESIGN_RUNTIME</title>
  <desc>Compact protective devotional mark for the temple website. Design state: DESIGN_RUNTIME.</desc>

  <defs>
    <!-- Background Ivory Silk Glow -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#F3E7D3"/>
    </radialGradient>

    <!-- Sacred Raksha Kali Flame (Deep Crimson to Radiant Saffron) -->
    <linearGradient id="favFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F241C"/>
      <stop offset="55%" stop-color="#C86A12"/>
      <stop offset="100%" stop-color="#B08A3E"/>
    </linearGradient>

    <!-- Inner Jyoti Radiant Core -->
    <linearGradient id="favInnerJyoti" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C86A12"/>
      <stop offset="50%" stop-color="#E5A642"/>
      <stop offset="100%" stop-color="#FBF4E6"/>
    </linearGradient>

    <!-- Temple Brass / Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED89B"/>
      <stop offset="50%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#7A591E"/>
    </linearGradient>
  </defs>

  <!-- Favicon Rounded Container (Sized for browser tabs & mobile icons) -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>

  <!-- Concentric Sanctum Rings (Centered at 16, 16) -->
  <circle cx="16" cy="16" r="14.25" fill="none" stroke="#8F241C" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#favGold)" stroke-width="0.6" opacity="0.85"/>

  <!-- Native 32x32 Centered Devotional Mark -->
  <g id="fav-mark" aria-hidden="true">
    <!-- 1. Outer Sacred Flame (Trishula-Jyoti) -->
    <path d="M16 5.75 C18.25 8.5 20.75 11.5 20.75 15 C20.75 18.25 18.75 20.25 16 21 C13.25 20.25 11.25 18.25 11.25 15 C11.25 11.5 13.75 8.5 16 5.75 Z" 
          fill="url(#favFlame)"/>

    <!-- 2. Mid Flame Radiance -->
    <path d="M16 8.5 C17.5 10.5 19 12.75 19 15 C19 17.25 17.5 19 16 19.5 C14.5 19 13 17.25 13 15 C13 12.75 14.5 10.5 16 8.5 Z" 
          fill="url(#favInnerJyoti)"/>

    <!-- 3. Core Sanctum Light -->
    <path d="M16 11.25 C17 12.75 17.75 14 17.75 15.5 C17.75 17 17 18 16 18.25 C15 18 14.25 17 14.25 15.5 C14.25 14 15 12.75 16 11.25 Z" 
          fill="#FBF4E6"/>

    <!-- 4. Sacred Vermilion Bindu -->
    <circle cx="16" cy="14.25" r="0.8" fill="#8F241C"/>

    <!-- 5. Diya Cup (Flame-to-Pedestal Lock) -->
    <path d="M11.75 19.75 C13.5 20.5 18.5 20.5 20.25 19.75 C19.5 21.25 17.75 21.75 16 21.75 C14.25 21.75 12.5 21.25 11.75 19.75 Z" 
          fill="url(#favGold)"/>
    <line x1="13.5" y1="21.25" x2="18.5" y2="21.25" stroke="#8F241C" stroke-width="0.5" stroke-linecap="round"/>

    <!-- 6. Lotus Pedestal Base -->
    <path d="M7.5 22 C10 19.75 12.5 19.5 16 22 C19.5 19.5 22 19.75 24.5 22 C22 21.75 19.5 23.25 16 24.5 C12.5 23.25 10 21.75 7.5 22 Z" 
          fill="url(#favGold)" stroke="#8F241C" stroke-width="0.4"/>

    <!-- 7. Altar Foundation Arc -->
    <path d="M9.25 23.25 C11.25 22.75 13.5 23.75 16 25 C18.5 23.75 20.75 22.75 22.75 23.25 C21 25 18.75 26.25 16 26.25 C13.25 26.25 11 25 9.25 23.25 Z" 
          fill="#8F241C"/>
    <path d="M10.25 23.75 C12 23.5 14 24.25 16 25.25 C18 24.25 20 23.5 21.75 23.75" 
          stroke="url(#favGold)" stroke-width="0.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
