  <!-- Lower Identification Cartouche / Ribbon -->
  <!-- Tapered to follow the natural contour of the shield -->
  <path d="M78 223 L242 223 C245 223 247 225 246 228 L238 262 C237 265 234 267 231 267 L89 267 C86 267 83 265 82 262 L74 228 C73 225 75 223 78 223 Z" fill="#8F241C" stroke="#B08A3E" stroke-width="1.5"/>
  <path d="M83 227 L237 227 L231 263 L89 263 Z" fill="none" stroke="#B08A3E" stroke-width="0.75" opacity="0.6"/>

  <!-- Emblem Text (Centered on X=160) -->
  <text x="160" y="243" text-anchor="middle" font-family="'Noto Sans Bengali', 'Nirmala UI', sans-serif" font-size="12.5" font-weight="700" fill="#FBF4E6" letter-spacing="0.5">শ্রী শ্রী রক্ষা কালী</text>
  <text x="160" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#B08A3E" letter-spacing="1.5">TEMPLE IDENTITY</text>
