  <!-- Decorative Sanctum Pilasters -->
  <rect x="120" y="138" width="7" height="74" fill="#B08A3E" opacity="0.9"/>
  <rect x="193" y="138" width="7" height="74" fill="#B08A3E" opacity="0.9"/>

