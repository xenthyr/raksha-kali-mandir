  <path d="M127 106 H193 L200 126 H120 Z" fill="#8F241C" stroke="#B08A3E" stroke-width="1"/>
  
  <!-- Chhala Eaves / Cornice -->
  <path d="M112 127 C136 123 184 123 208 127 L212 135 C186 131 134 131 108 135 Z" fill="#B08A3E"/>

  <!-- Garbhagriha (Sanctum Body) -->
