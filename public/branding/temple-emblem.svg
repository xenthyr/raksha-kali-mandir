<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <title>মা রক্ষা কালী মন্দির emblem — DESIGN_RUNTIME</title>
  <desc>Decorative temple identity emblem; not a historical or governmental emblem. Design state: DESIGN_RUNTIME.</desc>
  
  <!-- Outer Sacred Shield Base -->
  <path d="M160 18 L282 72 V174 C282 240 224 286 160 304 C96 286 38 240 38 174 V72 Z" fill="#FBF4E6" stroke="#8F241C" stroke-width="3.5" stroke-linejoin="round"/>
  
