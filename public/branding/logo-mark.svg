<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <title>মা রক্ষা কালী — DESIGN_RUNTIME</title>
  <desc>Protective Maa Kali inspired mark with restrained lotus and alpana geometry. Candidate brand asset; not a historical seal. Design state: DESIGN_RUNTIME.</desc>
  
  <defs>
    <!-- Background marble warmth -->
    <radialGradient id="markBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="80%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#F3E7D3"/>
    </radialGradient>

    <!-- Sacred Raksha Kali Flame (Deep Crimson to Radiant Saffron) -->
    <linearGradient id="markFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F241C"/>
      <stop offset="55%" stop-color="#C86A12"/>
      <stop offset="100%" stop-color="#B08A3E"/>
    </linearGradient>

    <!-- Inner Jyoti Radiant Core -->
    <linearGradient id="markInnerJyoti" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C86A12"/>
      <stop offset="50%" stop-color="#E5A642"/>
      <stop offset="100%" stop-color="#FBF4E6"/>
    </linearGradient>

    <!-- Temple Brass / Gold Gradient -->
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED89B"/>
      <stop offset="50%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#7A591E"/>
    </linearGradient>
  </defs>

  <!-- Base Plate & Sanctum Border Rings (Centered at 60, 60) -->
  <circle cx="60" cy="60" r="52" fill="url(#markBgGlow)" stroke="#8F241C" stroke-width="2.2"/>
  <circle cx="60" cy="60" r="47.5" fill="none" stroke="url(#markGold)" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="49.5" fill="none" stroke="#B08A3E" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.55"/>

  <!-- Eight Cardinal & Diagonal Sanctum Ray Indicators -->
  <g stroke="url(#markGold)" stroke-width="1" stroke-linecap="round" opacity="0.65">
    <line x1="60" y1="9.5" x2="60" y2="11.5"/>
    <line x1="60" y1="108.5" x2="60" y2="110.5"/>
    <line x1="9.5" y1="60" x2="11.5" y2="60"/>
    <line x1="108.5" y1="60" x2="110.5" y2="60"/>
  </g>

  <!-- Central Motif Container (Centered at 60, 60; Total Y: 19 to 101) -->
  <g id="sacred-mark" aria-hidden="true">
    
    <!-- 1. Outer Sacred Flame (Trishula-inspired Jyoti) -->
    <path d="M60 19 C69 30 79 42 79 56 C79 69 71 77 60 80 C49 77 41 69 41 56 C41 42 51 30 60 19 Z" 
          fill="url(#markFlame)"/>

    <!-- 2. Mid Flame Radiance Layer -->
    <path d="M60 30 C66 38 72 47 72 56 C72 65 66 72 60 74 C54 72 48 65 48 56 C48 47 54 38 60 30 Z" 
          fill="url(#markInnerJyoti)"/>

    <!-- 3. Core Sanctum Light -->
    <path d="M60 41 C64 47 67 52 67 58 C67 64 64 68 60 69 C56 68 53 64 53 58 C53 52 56 47 60 41 Z" 
          fill="#FBF4E6"/>

    <!-- 4. Divine Vermilion Trinetra / Bindu -->
    <circle cx="60" cy="53" r="2.2" fill="#8F241C"/>
    <circle cx="60" cy="53" r="0.8" fill="#FBF4E6"/>

    <!-- 5. Diya / Peetha Cup (Seamlessly locks flame to pedestal) -->
    <path d="M43 75 C50 78 70 78 77 75 C74 81 67 83 60 83 C53 83 46 81 43 75 Z" 
          fill="url(#markGold)"/>
    <line x1="50" y1="81" x2="70" y2="81" stroke="#8F241C" stroke-width="1" stroke-linecap="round"/>

    <!-- 6. Lotus Pedestal (Alpana Wing Base) -->
    <path d="M26 84 C36 75 46 74 60 84 C74 74 84 75 94 84 C84 83 74 89 60 94 C46 89 36 83 26 84 Z" 
          fill="url(#markGold)" stroke="#8F241C" stroke-width="0.8"/>

    <!-- 7. Lower Foundation Arch & Altar Foot -->
    <path d="M33 89 C41 87 50 91 60 96 C70 91 79 87 87 89 C80 96 71 101 60 101 C49 101 40 96 33 89 Z" 
          fill="#8F241C"/>

    <path d="M37 91 C44 90 52 93 60 97 C68 93 76 90 83 91" 
          stroke="url(#markGold)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Grounding Sacred Dot -->
    <circle cx="60" cy="98" r="1.2" fill="#FBF4E6"/>
  </g>
</svg>
