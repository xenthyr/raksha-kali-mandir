name: Accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "public/**"
      - "lib/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Playwright accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Verify accessibility suite exists
        id: suite
        shell: bash
        run: |
          if find tests/e2e -maxdepth 1 -type f -name '*.spec.ts' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No owned E2E accessibility suite exists yet; staged reconstruction is complete for this batch."
          fi

      - name: Run Playwright accessibility suite
        if: steps.suite.outputs.available == 'true'
        run: npx playwright test tests/e2e --grep-invert "@manual"
